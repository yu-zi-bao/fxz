<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoYu 之家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 0; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; }
        .container { width: 92%; max-width: 580px; text-align: center; }
        h1 { font-size: 28px; margin-bottom: 8px; color: #667eea; text-shadow: 2px 2px 0 rgba(255,255,255,0.5); }
        .subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 30px; }
        .card { background: white; border-radius: 20px; padding: 22px; margin-bottom: 16px; border: 3px solid #dfe6e9; text-align: left; cursor: pointer; transition: all 0.3s ease; display: block; text-decoration: none; color: #333; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); }
        .card:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0 rgba(102,126,234,0.2); background: #f8f9fa; }
        .card:active { transform: translate(0, 0); box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; color: #667eea; }
        .card-desc { font-size: 13px; color: #7f8c8d; }
        .card-icon { font-size: 24px; }
        .qr-section { margin-top: 40px; padding: 20px; background: white; border-radius: 20px; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); }
        .qr-section img { width: 130px; border-radius: 12px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .qr-tip { font-size: 13px; color: #7f8c8d; margin-top: 12px; }
        .footer { margin-top: 20px; font-size: 12px; color: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 XiaoYu 之家</h1>
        <div class="subtitle">手机电脑实时同步 · 随时随地访问 ✨</div>
        
        <a href="./notepad/" class="card">
            <div class="card-title"><span class="card-icon">📝</span> 云端记事本</div>
            <div class="card-desc">多设备实时同步的备忘录</div>
        </a>

        <a href="./learning/" class="card">
            <div class="card-title"><span class="card-icon">🎓</span> 学习管理</div>
            <div class="card-desc">作业发布 · 每日打卡 · 积分兑换</div>
        </a>

        <a href="./exam/" class="card">
            <div class="card-title"><span class="card-icon">📖</span> 在线考试</div>
            <div class="card-desc">答题练习功能（即将更新）</div>
        </a>

        <div class="qr-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://yu-zi-bao.github.io/fxz/" alt="扫码查看">
            <div class="qr-tip">📱 手机扫码即可在移动端同步访问</div>
        </div>

        <div class="footer">云端存储 by Gitee · Made with 💜</div>
    </div>
</body>
</html>

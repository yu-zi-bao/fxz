<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello H5</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }
        .circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        .c1 { width: 100px; height: 100px; top: 10%; left: 10%; animation-delay: 0s; }
        .c2 { width: 150px; height: 150px; bottom: 20%; right: 10%; animation-delay: 2s; }
        .c3 { width: 60px; height: 60px; top: 40%; right: 30%; animation-delay: 4s; }

        .content {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        .btn {
            background: white;
            color: #764ba2;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            display: inline-block;
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* 二维码区域 - 保持玻璃拟态风格 */
        .qr-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .qr-section img {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .qr-tip {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.85;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>

    <div class="content">
        <h1>Hello, XiaoYu!</h1>
        <p>恭喜你，你的第一个 H5 页面成功发布了！</p>
        <p>这是通过 GitHub Pages 托管的页面。</p>
        <a href="../../" class="btn">返回发布中心</a>

        <!-- 二维码区域 -->
        <div class="qr-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://yu-zi-bao.github.io/fxz/index.html/" alt="扫码查看">
            <div class="qr-tip">📱 手机扫码即可在移动端查看</div>
        </div>
    </div>
</body>
</html>

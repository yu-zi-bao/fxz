<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoYu H5 发布平台</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; }
        .circle { position: absolute; background: rgba(255, 255, 255, 0.1); border-radius: 50%; animation: float 6s infinite ease-in-out; }
        .c1 { width: 100px; height: 100px; top: 10%; left: 10%; animation-delay: 0s; }
        .c2 { width: 150px; height: 150px; bottom: 20%; right: 10%; animation-delay: 2s; }
        .c3 { width: 60px; height: 60px; top: 40%; right: 30%; animation-delay: 4s; }
        .content { text-align: center; z-index: 10; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); border: 1px solid rgba(255, 255, 255, 0.18); margin: 20px; width: 90%; max-width: 500px; }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { font-size: 16px; opacity: 0.9; margin-bottom: 30px; }
        .menu-card { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s; }
        .menu-card:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.2); }
        .card-info { flex: 1; margin-right: 10px; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .card-desc { font-size: 13px; opacity: 0.8; margin: 0; }
        .btn { text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; transition: all 0.2s; white-space: nowrap; }
        .btn-news { background: rgba(33, 150, 243, 0.7); color: white; box-shadow: 0 2px 10px rgba(33, 150, 243, 0.3); }
        .btn-news:hover { background: rgba(33, 150, 243, 1); }
        .btn-study { background: rgba(156, 39, 176, 0.7); color: white; box-shadow: 0 2px 10px rgba(156, 39, 176, 0.3); }
        .btn-study:hover { background: rgba(156, 39, 176, 1); }
        .btn-exam { background: rgba(220, 53, 69, 0.6); color: white; box-shadow: 0 2px 10px rgba(220, 53, 69, 0.3); }
        .btn-exam:hover { background: rgba(220, 53, 69, 0.9); }
        .qr-section { margin-top: 30px; padding-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.2); }
        .qr-section img { width: 140px; height: 140px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .qr-tip { margin-top: 12px; font-size: 13px; opacity: 0.85; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>

    <div class="content">
        <h1>🚀 XiaoYu H5 发布中心</h1>
        <p>基于 GitHub Pages 搭建的个人发布平台</p>

        <!-- 模块 1：记事本 -->
        <div class="menu-card">
            <div class="card-info">
                <div class="card-title">📰 记事本</div>
                <div class="card-desc">做笔记、别忘记</div>
            </div>
            <a href="./note/" class="btn btn-news">查看</a>
        </div>

        <!-- 模块 2：学习管理平台 -->
        <div class="menu-card">
            <div class="card-info">
                <div class="card-title">🎓 学习管理平台</div>
                <div class="card-desc">作业发布、每日打卡、积分兑换</div>
            </div>
            <a href="./learning/" class="btn btn-study">管理</a>
        </div>

        <!-- 模块 3：在线考试 -->
        <div class="menu-card">
            <div class="card-info">
                <div class="card-title">📖 在线考试</div>
                <div class="card-desc">在线答题、模拟考试</div>
            </div>
            <a href="./exam/" class="btn btn-exam">开始</a>
        </div>

        <!-- 二维码区域 -->
        <div class="qr-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://yu-zi-bao.github.io/fxz/" alt="扫码查看">
            <div class="qr-tip">📱 手机扫码即可在移动端查看</div>
        </div>
    </div>
</body>
</html>

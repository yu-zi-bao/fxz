<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 H5 发布中心 (云端版)</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .container { width: 95%; max-width: 600px; text-align: center; }
        h1 { margin-bottom: 30px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); text-align: left; cursor: pointer; transition: transform 0.2s; display: block; text-decoration: none; color: white; }
        .card:active { transform: scale(0.98); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .card-desc { font-size: 14px; opacity: 0.8; }
        .qr-section { margin-top: 40px; }
        .qr-section img { width: 120px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .qr-tip { font-size: 12px; opacity: 0.8; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 XiaoYu H5 发布中心</h1>
        
        <a href="./notepad/" class="card">
            <div class="card-title">📝 云端记事本</div>
            <div class="card-desc">手机电脑实时同步的备忘录</div>
        </a>

        <a href="./learning/" class="card">
            <div class="card-title">🎓 学习管理平台</div>
            <div class="card-desc">每日作业发布、打卡与积分兑换</div>
        </a>

        <a href="./exam/" class="card">
            <div class="card-title">📖 在线考试</div>
            <div class="card-desc">答题练习功能（即将更新）</div>
        </a>

        <div class="qr-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://yu-zi-bao.github.io/fxz/" alt="扫码查看">
            <div class="qr-tip">📱 手机扫码即可在移动端同步访问</div>
        </div>
    </div>
</body>
</html>

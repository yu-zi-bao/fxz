<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理平台 - 云端版</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .container { width: 95%; max-width: 600px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 20px; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .section-title { border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; margin: 20px 0 15px 0; font-size: 18px; font-weight: bold; }
        .card { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input, select { flex: 1; padding: 10px; border-radius: 8px; border: none; outline: none; background: rgba(255,255,255,0.9); }
        button { padding: 10px 15px; border-radius: 8px; border: none; background: #ff7e5f; color: white; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        button:active { transform: scale(0.95); }
        .task-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .task-desc { flex: 1; }
        .points { color: #ffd700; font-weight: bold; margin-right: 10px; }
        .delete-btn { background: #ff4757; margin-left: 5px; }
        .back-btn { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: white; font-weight: bold; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; }
        .loading { text-align: center; padding: 20px; opacity: 0.8; }
        .user-points { text-align: center; font-size: 20px; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 学习管理打卡平台</h1>
        <div id="loading" class="loading">⏳ 正在连接云端数据...</div>
        
        <div id="content" style="display: none;">
            <div class="user-points">当前积分：<span id="currentPoints">0</span> 💰</div>

            <div class="section-title">📝 每日作业 (家长发布)</div>
            <div class="input-group">
                <input type="text" id="jobTitle" placeholder="输入作业内容...">
                <button onclick="addJob()">发布到云端</button>
            </div>
            <div id="jobList"></div>

            <div class="section-title">🎯 打卡任务配置</div>
            <div class="input-group">
                <input type="text" id="taskName" placeholder="任务名称">
                <input type="number" id="taskPoints" placeholder="积分" style="width: 70px; flex: none;"> 分
                <button onclick="addTaskConfig()">添加</button>
            </div>
            <div id="taskConfigList"></div>

            <div class="section-title">✅ 今日打卡 (小朋友勾选)</div>
            <div id="taskList"></div>

            <div class="section-title">🎁 积分兑换</div>
            <div class="input-group">
                <input type="text" id="rewardName" placeholder="奖品名称">
                <input type="number" id="rewardCost" placeholder="消耗积分" style="width: 80px; flex: none;">
                <button onclick="addReward()">添加</button>
            </div>
            <div id="rewardList"></div>
        </div>

        <a href="https://yu-zi-bao.github.io/fxz/" class="back-btn">🏠 返回首页</a>
    </div>

    <script>
        // JSONBin.io 云端配置
        const BIN_ID = '6a9549aef5f4af5e2957104e';
        const MASTER_KEY = '$2a$10$3Y8Qx4mwT5aKis/b.SFn4O6pWW43WXfbD5XyzYVQ.aMYLohLkbvpy';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const HEADERS = {
            '$masterKey': MASTER_KEY,
            'Content-Type': 'application/json'
        };

        let appData = { tasks: [], tasksConfig: [], pointsConfig: [], pointsLog: [] };

        // 读取云端数据
        async function loadFromCloud() {
            try {
                const res = await fetch(`${API_URL}/latest`, { headers: HEADERS });
                const data = await res.json();
                return data.record || { tasks: [], tasksConfig: [], pointsConfig: [], pointsLog: [] };
            } catch(e) {
                console.error('加载失败', e);
                return { tasks: [], tasksConfig: [], pointsConfig: [], pointsLog: [] };
            }
        }

        // 写入云端数据
        async function saveToCloud(data) {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: HEADERS,
                    body: JSON.stringify(data)
                });
            } catch(e) {
                console.error('保存失败', e);
                alert('保存失败，请稍后重试');
            }
        }

        // 初始化
        async function init() {
            appData = await loadFromCloud();
            render();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        // 渲染所有列表
        function render() {
            const points = appData.tasks.reduce((sum, t) => sum + (t.done ? (t.points || 0) : 0), 0);
            document.getElementById('currentPoints').textContent = points;

            // 作业列表
            document.getElementById('jobList').innerHTML = appData.tasks.filter(t => t.type === 'job').map(t => `
                <div class="task-item card">
                    <div class="task-desc">📝 ${escapeHtml(t.name)}</div>
                    <button class="delete-btn" onclick="deleteItem('${t.id}')">删除</button>
                </div>
            `).join('') || '<div style="opacity:0.6; text-align:center">暂无作业</div>';

            // 任务配置列表
            document.getElementById('taskConfigList').innerHTML = appData.tasksConfig.map(t => `
                <div class="task-item card">
                    <div class="task-desc">🎯 ${escapeHtml(t.name)} (+${t.points}分)</div>
                    <button class="delete-btn" onclick="deleteConfig('${t.id}')">删除</button>
                </div>
            `).join('');

            // 今日打卡
            const today = new Date().toDateString();
            document.getElementById('taskList').innerHTML = appData.tasksConfig.map(cfg => {
                const existing = appData.tasks.find(t => t.name === cfg.name && t.date === today && t.type === 'task');
                const isDone = existing && existing.done;
                return `
                    <div class="task-item card">
                        <div class="task-desc">${isDone ? '✅' : '⬜'} ${escapeHtml(cfg.name)}</div>
                        <button onclick="checkTask('${cfg.name}', ${cfg.points})">${isDone ? '已打卡' : '打卡'}</button>
                    </div>
                `;
            }).join('') || '<div style="opacity:0.6; text-align:center">请先配置任务</div>';

            // 奖品列表
            document.getElementById('rewardList').innerHTML = appData.pointsConfig.map(r => `
                <div class="task-item card">
                    <div class="task-desc">🎁 ${escapeHtml(r.name)} <span class="points">(${r.cost}分)</span></div>
                    <button onclick="redeemReward('${r.name}', ${r.cost})">兑换</button>
                    <button class="delete-btn" onclick="deleteReward('${r.id}')">删除</button>
                </div>
            `).join('');
        }

        // 添加作业
        async function addJob() {
            const title = document.getElementById('jobTitle').value.trim();
            if (!title) { alert('请输入作业内容'); return; }
            appData.tasks.push({ id: Date.now().toString(), type: 'job', name: title });
            await saveToCloud(appData);
            document.getElementById('jobTitle').value = '';
            render();
        }

        // 添加任务配置
        async function addTaskConfig() {
            const name = document.getElementById('taskName').value.trim();
            const points = parseInt(document.getElementById('taskPoints').value) || 10;
            if (!name) { alert('请输入任务名称'); return; }
            appData.tasksConfig.push({ id: Date.now().toString(), name, points });
            await saveToCloud(appData);
            document.getElementById('taskName').value = '';
            document.getElementById('taskPoints').value = '';
            render();
        }

        // 打卡
        async function checkTask(name, points) {
            const today = new Date().toDateString();
            const existing = appData.tasks.find(t => t.name === name && t.date === today && t.type === 'task');
            if (existing) {
                existing.done = !existing.done;
            } else {
                appData.tasks.push({ id: Date.now().toString(), type: 'task', name, points, date: today, done: true });
            }
            await saveToCloud(appData);
            render();
        }

        // 添加奖品
        async function addReward() {
            const name = document.getElementById('rewardName').value.trim();
            const cost = parseInt(document.getElementById('rewardCost').value);
            if (!name || !cost) { alert('请填写完整'); return; }
            appData.pointsConfig.push({ id: Date.now().toString(), name, cost });
            await saveToCloud(appData);
            document.getElementById('rewardName').value = '';
            document.getElementById('rewardCost').value = '';
            render();
        }

        // 兑换奖品
        async function redeemReward(name, cost) {
            const current = appData.tasks.reduce((sum, t) => sum + (t.done ? (t.points || 0) : 0), 0);
            if (current < cost) { alert('积分不足！'); return; }
            if (!confirm(`确认兑换 ${name} 吗？将扣除 ${cost} 分`)) return;
            
            appData.pointsLog.push({ date: new Date().toLocaleString(), reward: name, cost: cost });
            
            // 扣减积分（撤销打卡）
            let toDeduct = cost;
            for (let i = appData.tasks.length - 1; i >= 0; i--) {
                if (appData.tasks[i].done && appData.tasks[i].type === 'task') {
                    appData.tasks[i].done = false;
                    toDeduct -= appData.tasks[i].points;
                    if (toDeduct <= 0) break;
                }
            }
            await saveToCloud(appData);
            render();
        }

        // 删除函数
        async function deleteItem(id) { appData.tasks = appData.tasks.filter(t => t.id !== id); await saveToCloud(appData); render(); }
        async function deleteConfig(id) { appData.tasksConfig = appData.tasksConfig.filter(t => t.id !== id); await saveToCloud(appData); render(); }
        async function deleteReward(id) { appData.pointsConfig = appData.pointsConfig.filter(t => t.id !== id); await saveToCloud(appData); render(); }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>

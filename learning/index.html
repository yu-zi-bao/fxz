<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理 - 选择身份</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px 30px; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; }
        .container { width: 92%; max-width: 500px; text-align: center; }
        h1 { font-size: 30px; color: #667eea; text-shadow: 2px 2px 0 rgba(255,255,255,0.5); margin-bottom: 10px; }
        .subtitle { font-size: 15px; color: #7f8c8d; margin-bottom: 40px; }
        .role-card { background: white; border-radius: 24px; padding: 35px 25px; margin-bottom: 20px; border: 3px solid #dfe6e9; cursor: pointer; transition: all 0.3s ease; display: block; text-decoration: none; color: #333; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); }
        .role-card:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0 rgba(102,126,234,0.2); border-color: #667eea; }
        .role-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        .role-icon { font-size: 60px; margin-bottom: 15px; }
        .role-title { font-size: 24px; font-weight: bold; color: #667eea; margin-bottom: 10px; }
        .role-desc { font-size: 14px; color: #7f8c8d; line-height: 1.8; }
        .back-link { position: fixed; top: 20px; left: 20px; color: #667eea; text-decoration: none; font-weight: bold; background: white; padding: 10px 18px; border-radius: 20px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); transition: 0.2s; }
        .back-link:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 rgba(102,126,234,0.2); }
    </style>
</head>
<body>
    <a href="../" class="back-link">← 返回首页</a>
    
    <div class="container">
        <h1>🎓 学习管理</h1>
        <div class="subtitle">请选择你的身份 👇</div>

        <a href="./parent.html" class="role-card">
            <div class="role-icon">👨‍👩‍👧</div>
            <div class="role-title">家长端</div>
            <div class="role-desc">
                🔐 需要密码登录<br>
                📚 发布每日作业<br>
                ✅ 配置打卡任务与积分<br>
                🎁 管理奖品兑换列表<br>
                💰 手动增减小朋友积分
            </div>
        </a>

        <a href="./child-select.html" class="role-card">
            <div class="role-icon">🎒</div>
            <div class="role-title">小朋友端</div>
            <div class="role-desc">
                👧 请选择你的身份<br>
                📖 查看今日作业<br>
                ⭐ 完成打卡赚积分<br>
                🎁 用积分兑换心仪奖品
            </div>
        </a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理 - 角色选择</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px 30px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .container { width: 92%; max-width: 500px; text-align: center; }
        h1 { font-size: 28px; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .subtitle { font-size: 15px; opacity: 0.85; margin-bottom: 40px; }
        .role-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); border-radius: 20px; padding: 35px 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.25); cursor: pointer; transition: all 0.3s ease; display: block; text-decoration: none; color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .role-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); background: rgba(255, 255, 255, 0.22); }
        .role-card:active { transform: scale(0.97); }
        .role-icon { font-size: 56px; margin-bottom: 12px; }
        .role-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .role-desc { font-size: 14px; opacity: 0.85; line-height: 1.5; }
        .back-link { position: fixed; top: 20px; left: 20px; color: white; text-decoration: none; opacity: 0.8; font-size: 14px; background: rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 10px; transition: 0.2s; }
        .back-link:hover { opacity: 1; background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>
    <a href="../" class="back-link">← 返回首页</a>
    <div class="container">
        <h1>🎓 学习管理</h1>
        <div class="subtitle">请选择你的身份</div>
        <a href="./parent.html" class="role-card">
            <div class="role-icon">👨‍👩‍👧</div>
            <div class="role-title">家长端</div>
            <div class="role-desc">📚 发布每日作业<br>✅ 配置打卡任务与积分<br>🎁 管理奖品兑换列表<br>📊 查看孩子学习记录</div>
        </a>
        <a href="./child.html" class="role-card">
            <div class="role-icon">🎒</div>
            <div class="role-title">小朋友端</div>
            <div class="role-desc">📖 查看每日作业<br>⭐ 完成打卡赚积分<br>🎁 用积分兑换心仪奖品<br>📈 查看我的成长记录</div>
        </a>
    </div>
</body>
</html>

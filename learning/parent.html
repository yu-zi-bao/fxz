<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理（家长端）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .back-link { position: absolute; top: 5px; left: 0; color: #667eea; text-decoration: none; font-weight: bold; background: white; padding: 8px 16px; border-radius: 20px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #667eea; text-shadow: 2px 2px 0 rgba(255,255,255,0.5); }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(255,255,255,0.3); padding: 5px; border-radius: 16px; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 14px; color: #636e72; }
        .tab.active { background: white; color: #667eea; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); border: 3px solid #dfe6e9; }
        .card-title { font-size: 18px; font-weight: bold; color: #667eea; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px 16px; border: 2px solid #dfe6e9; border-radius: 12px; font-size: 15px; margin-bottom: 10px; font-family: inherit; background: #f8f9fa; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; background: white; }
        textarea { height: 80px; resize: vertical; }
        .btn { padding: 10px 24px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-family: inherit; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: #ff6b6b; color: white; }
        .item-card { background: #f8f9fa; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 2px solid #dfe6e9; display: flex; justify-content: space-between; align-items: center; }
        .item-info { flex: 1; }
        .item-title { font-weight: bold; color: #333; }
        .item-desc { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
        .item-actions .btn { padding: 6px 12px; font-size: 12px; }
        #loading { text-align: center; padding: 30px; color: #667eea; }
        #error { display: none; background: #ffeaa7; padding: 12px 18px; border-radius: 12px; margin-bottom: 15px; color: #d63031; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回</a>
            <h1>👨‍👩‍👧 家长端</h1>
        </div>
        <div id="error"></div>
        <div id="loading">🔄 正在加载数据...</div>
        <div id="content" style="display:none;">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('homework')">📚 作业</div>
                <div class="tab" onclick="switchTab('tasks')">✅ 打卡任务</div>
                <div class="tab" onclick="switchTab('prizes')">🎁 奖品</div>
                <div class="tab" onclick="switchTab('records')">📊 记录</div>
            </div>
            <div id="homework" class="section active">
                <div class="card">
                    <div class="card-title">📝 发布作业</div>
                    <input type="date" id="hwDate">
                    <input type="text" id="hwTitle" placeholder="作业标题（如：数学作业）">
                    <textarea id="hwContent" placeholder="详细作业内容..."></textarea>
                    <button class="btn btn-primary" onclick="addHomework()">发布作业</button>
                </div>
                <div id="homeworkList"></div>
            </div>
            <div id="tasks" class="section">
                <div class="card">
                    <div class="card-title">⭐ 添加打卡任务</div>
                    <input type="text" id="taskName" placeholder="任务名称（如：背诵课文）">
                    <input type="number" id="taskPoints" placeholder="完成积分（如：10）" min="1">
                    <button class="btn btn-primary" onclick="addTask()">添加任务</button>
                </div>
                <div id="taskList"></div>
            </div>
            <div id="prizes" class="section">
                <div class="card">
                    <div class="card-title">🎁 添加奖品</div>
                    <input type="text" id="prizeName" placeholder="奖品名称（如：看手机20分钟）">
                    <input type="number" id="prizeCost" placeholder="所需积分（如：50）" min="1">
                    <button class="btn btn-primary" onclick="addPrize()">添加奖品</button>
                </div>
                <div id="prizeList"></div>
            </div>
            <div id="records" class="section">
                <div class="card">
                    <div class="card-title">📊 学习记录</div>
                    <div id="pointsInfo" style="margin-bottom:15px;padding:12px;background:#dfe6e9;border-radius:12px;"></div>
                </div>
                <div id="recordList"></div>
            </div>
        </div>
    </div>
    <script>
        const GITEE_CONFIG = { USER: 'fengwolf3', REPO: 'h5-data', TOKEN: '8903f7dbff4a9eabb1d75ce37ba9ec4c', BRANCH: 'master', API: 'https://gitee.com/api/v5/repos' };
        let data = { homework: [], tasksConfig: [], pointsConfig: [], pointsLog: [] };
        async function loadData() {
            try {
                const url = `${GITEE_CONFIG.API}/${GITEE_CONFIG.USER}/${GITEE_CONFIG.REPO}/contents/data/learning.json?ref=${GITEE_CONFIG.BRANCH}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${GITEE_CONFIG.TOKEN}` } });
                if (!res.ok) throw new Error(`云端返回 ${res.status}`);
                const json = await res.json();
                data = JSON.parse(atob(json.content));
                if (!data.homework) data.homework = [];
                if (!data.tasksConfig) data.tasksConfig = [];
                if (!data.pointsConfig) data.pointsConfig = [];
                if (!data.pointsLog) data.pointsLog = [];
                renderAll();
            } catch(e) { showError('加载失败：' + e.message); }
        }
        async function saveData() {
            const url = `${GITEE_CONFIG.API}/${GITEE_CONFIG.USER}/${GITEE_CONFIG.REPO}/contents/data/learning.json`;
            const body = { content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))), message: '家长端更新', branch: GITEE_CONFIG.BRANCH };
            const res = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GITEE_CONFIG.TOKEN}` }, body: JSON.stringify(body) });
            if (!res.ok) throw new Error(`保存失败 ${res.status}`);
        }
        function addHomework() {
            const date = document.getElementById('hwDate').value;
            const title = document.getElementById('hwTitle').value.trim();
            const content = document.getElementById('hwContent').value.trim();
            if (!title) { alert('请填写标题'); return; }
            data.homework.unshift({ id: 'hw' + Date.now(), date: date || '未指定', title, content, createdAt: new Date().toLocaleString('zh-CN') });
            document.getElementById('hwTitle').value = ''; document.getElementById('hwContent').value = '';
            saveData().then(renderAll).catch(e => alert('保存失败：' + e.message));
        }
        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const points = parseInt(document.getElementById('taskPoints').value);
            if (!name || !points) { alert('请填写完整'); return; }
            data.tasksConfig.push({ id: 'tk' + Date.now(), name, points });
            document.getElementById('taskName').value = ''; document.getElementById('taskPoints').value = '';
            saveData().then(renderAll).catch(e => alert('保存失败：' + e.message));
        }
        function addPrize() {
            const name = document.getElementById('prizeName').value.trim();
            const cost = parseInt(document.getElementById('prizeCost').value);
            if (!name || !cost) { alert('请填写完整'); return; }
            data.pointsConfig.push({ id: 'pz' + Date.now(), name, cost });
            document.getElementById('prizeName').value = ''; document.getElementById('prizeCost').value = '';
            saveData().then(renderAll).catch(e => alert('保存失败：' + e.message));
        }
        function deleteItem(type, id) {
            if (!confirm('确定删除？')) return;
            if (type === 'homework') data.homework = data.homework.filter(i => i.id !== id);
            else if (type === 'task') data.tasksConfig = data.tasksConfig.filter(i => i.id !== id);
            else if (type === 'prize') data.pointsConfig = data.pointsConfig.filter(i => i.id !== id);
            saveData().then(renderAll).catch(e => alert('删除失败：' + e.message));
        }
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelector(`.tab[onclick*="${tab}"]`).classList.add('active');
            document.getElementById(tab).classList.add('active');
        }
        function renderAll() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('homeworkList').innerHTML = data.homework.length ? data.homework.map(h => `<div class="item-card"><div class="item-info"><div class="item-title">${h.title}</div><div class="item-desc">${h.date} · ${h.createdAt}</div><div style="margin-top:5px;font-size:13px;color:#555;">${h.content || ''}</div></div><div class="item-actions"><button class="btn btn-danger" onclick="deleteItem('homework','${h.id}')">删除</button></div></div>`).join('') : '<div style="text-align:center;padding:30px;color:#95a5a6;">暂无作业</div>';
            document.getElementById('taskList').innerHTML = data.tasksConfig.length ? data.tasksConfig.map(t => `<div class="item-card"><div class="item-info"><div class="item-title">${t.name}</div><div class="item-desc">✅ 完成获得 ${t.points} 积分</div></div><div class="item-actions"><button class="btn btn-danger" onclick="deleteItem('task','${t.id}')">删除</button></div></div>`).join('') : '<div style="text-align:center;padding:30px;color:#95a5a6;">暂无打卡任务</div>';
            document.getElementById('prizeList').innerHTML = data.pointsConfig.length ? data.pointsConfig.map(p => `<div class="item-card"><div class="item-info"><div class="item-title">🎁 ${p.name}</div><div class="item-desc">需要 ${p.cost} 积分兑换</div></div><div class="item-actions"><button class="btn btn-danger" onclick="deleteItem('prize','${p.id}')">删除</button></div></div>`).join('') : '<div style="text-align:center;padding:30px;color:#95a5a6;">暂无奖品</div>';
            const totalPoints = data.pointsLog.reduce((sum, l) => sum + (l.type === 'earn' ? l.points : -l.points), 0);
            document.getElementById('pointsInfo').innerHTML = `<strong>📈 累计打卡：</strong>${data.pointsLog.filter(l=>l.type==='earn').length} 次 &nbsp; <strong>🎁 兑换：</strong>${data.pointsLog.filter(l=>l.type==='redeem').length} 次 &nbsp; <strong>⭐ 总积分：</strong>${totalPoints}`;
            document.getElementById('recordList').innerHTML = data.pointsLog.length ? data.pointsLog.slice(0,20).map(l => `<div class="item-card"><div class="item-info"><div class="item-title">${l.type === 'earn' ? '⭐ 打卡' : '🎁 兑换'} - ${l.name}</div><div class="item-desc">${l.type === 'earn' ? '+' : '-'}${l.points} 积分 · ${l.time}</div></div></div>`).join('') : '<div style="text-align:center;padding:30px;color:#95a5a6;">暂无记录</div>';
        }
        function showError(msg) { const el = document.getElementById('error'); el.textContent = '⚠️ ' + msg; el.style.display = 'block'; document.getElementById('loading').style.display = 'none'; }
        window.onload = () => { document.getElementById('hwDate').value = new Date().toISOString().split('T')[0]; loadData(); };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理（家长端）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; color: white; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: white; text-decoration: none; opacity: 0.8; }
        h1 { font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { flex: 1; min-width: 70px; padding: 10px; text-align: center; background: rgba(255,255,255,0.15); border-radius: 10px; cursor: pointer; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; }
        .tab.active { background: rgba(255,255,255,0.9); color: #764ba2; font-weight: bold; }
        .card { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .card-title { font-weight: 600; margin-bottom: 4px; }
        .card-desc { font-size: 13px; opacity: 0.8; }
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group input, .input-group textarea { flex: 1; min-width: 100px; padding: 10px; border: none; border-radius: 10px; background: rgba(255,255,255,0.15); color: white; font-size: 14px; }
        .input-group textarea { width: 100%; min-height: 60px; resize: vertical; }
        .input-group input::placeholder, .input-group textarea::placeholder { color: rgba(255,255,255,0.5); }
        .btn { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; background: rgba(255,255,255,0.9); color: #764ba2; }
        .btn:active { transform: scale(0.96); }
        .btn-del { background: rgba(239,68,68,0.8); color: white; font-size: 11px; padding: 4px 10px; }
        .status { text-align: center; font-size: 12px; opacity: 0.7; margin-bottom: 10px; min-height: 18px; }
        .empty { text-align: center; padding: 30px; opacity: 0.6; font-size: 13px; }
        .points-badge { display: inline-block; background: linear-gradient(135deg, #FFD700, #FFA500); color: #333; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }
        .log-item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回</a>
            <h1>👨‍👩‍👧 学习管理（家长端）</h1>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="tab('homework')">📚 作业</div>
            <div class="tab" onclick="tab('tasks')">✅ 打卡任务</div>
            <div class="tab" onclick="tab('rewards')">🎁 奖品</div>
            <div class="tab" onclick="tab('log')">📊 记录</div>
        </div>
        <div class="status" id="status"></div>
        <div id="content"></div>
    </div>
<script>
const G = { user:'yusunhui', repo:'h5-data', token:'8903f7dbff4a9eabb1d75ce37ba9ec4c', branch:'master', path:'data/learning.json' };
let D = { homework:[], tasksConfig:[], tasks:[], pointsConfig:[], pointsLog:[] };
let curTab = 'homework', editId = null;

async function load() {
    const s = document.getElementById('status'); s.textContent = '⏳ 加载中...';
    try {
        const r = await fetch(`https://gitee.com/api/v5/repos/${G.user}/${G.repo}/contents/${G.path}?ref=${G.branch}`, { headers:{'Authorization':'Bearer '+G.token} });
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json(); D = JSON.parse(atob(j.content));
        if(!D.homework)D.homework=[]; if(!D.tasksConfig)D.tasksConfig=[]; if(!D.tasks)D.tasks=[];
        if(!D.pointsConfig)D.pointsConfig=[]; if(!D.pointsLog)D.pointsLog=[];
        s.textContent = '✅ 加载成功';
    } catch(e) { s.textContent = '⚠️ 失败: '+e.message; console.error(e); }
    render();
}

async function save() {
    const s = document.getElementById('status'); s.textContent = '⏳ 保存中...';
    try {
        const r = await fetch(`https://gitee.com/api/v5/repos/${G.user}/${G.repo}/contents/${G.path}`, {
            method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+G.token},
            body:JSON.stringify({content:btoa(JSON.stringify(D,null,2)),message:'家长端更新',branch:G.branch})
        });
        if(!r.ok) throw new Error('HTTP '+r.status);
        s.textContent = '✅ 已保存'; setTimeout(()=>s.textContent='',2000);
    } catch(e) { s.textContent = '⚠️ 保存失败: '+e.message; console.error(e); }
}

function tab(t) { curTab = t; document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active',['homework','tasks','rewards','log'][i]===t)); render(); }
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

function addHomework() {
    const title = document.getElementById('hwTitle').value.trim();
    const content = document.getElementById('hwContent').value.trim();
    if(!title){alert('请输入作业标题');return;}
    if(editId) { const h = D.homework.find(x=>x.id===editId); if(h){h.title=title;h.content=content;} editId=null; }
    else { D.homework.unshift({id:Date.now().toString(),title,content,date:new Date().toISOString().split('T')[0]}); }
    document.getElementById('hwTitle').value=''; document.getElementById('hwContent').value=''; render(); save();
}
function delHw(id){if(!confirm('确定删除？'))return; D.homework=D.homework.filter(x=>x.id!==id); render(); save();}

function addTask() {
    const name = document.getElementById('taskName').value.trim();
    const pts = parseInt(document.getElementById('taskPts').value) || 10;
    if(!name){alert('请输入任务名称');return;}
    D.tasksConfig.push({id:Date.now().toString(),name,points:pts,icon:'⭐'});
    document.getElementById('taskName').value=''; document.getElementById('taskPts').value='10'; render(); save();
}
function delTask(id){if(!confirm('确定删除？'))return; D.tasksConfig=D.tasksConfig.filter(x=>x.id!==id); render(); save();}

function addReward() {
    const name = document.getElementById('rwName').value.trim();
    const cost = parseInt(document.getElementById('rwCost').value) || 50;
    if(!name){alert('请输入奖品名称');return;}
    D.pointsConfig.push({id:Date.now().toString(),name,cost});
    document.getElementById('rwName').value=''; document.getElementById('rwCost').value='50'; render(); save();
}
function delReward(id){if(!confirm('确定删除？'))return; D.pointsConfig=D.pointsConfig.filter(x=>x.id!==id); render(); save();}

function render() {
    const c = document.getElementById('content');
    if(curTab==='homework') {
        c.innerHTML = `<div class="input-group"><input id="hwTitle" placeholder="作业标题..."><textarea id="hwContent" placeholder="作业内容..."></textarea><button class="btn" onclick="addHomework()">✨ 发布作业</button></div>` +
            D.homework.map(h=>`<div class="card"><div class="card-title">📚 ${esc(h.title)}</div><div class="card-desc">${esc(h.content)}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span style="font-size:12px;opacity:0.6">📅 ${h.date}</span><button class="btn btn-del" onclick="delHw('${h.id}')">删除</button></div></div>`).join('') || '<div class="empty">暂无作业</div>';
    } else if(curTab==='tasks') {
        c.innerHTML = `<div class="input-group"><input id="taskName" placeholder="任务名称..."><input id="taskPts" type="number" value="10" placeholder="积分"><button class="btn" onclick="addTask()">✨ 添加任务</button></div>` +
            D.tasksConfig.map(t=>`<div class="card"><div class="card-title">${t.icon||'⭐'} ${esc(t.name)}</div><div class="card-desc">完成奖励: <span class="points-badge">+${t.points} 积分</span></div><div style="margin-top:6px"><button class="btn btn-del" onclick="delTask('${t.id}')">删除</button></div></div>`).join('') || '<div class="empty">暂无打卡任务</div>';
    } else if(curTab==='rewards') {
        c.innerHTML = `<div class="input-group"><input id="rwName" placeholder="奖品名称..."><input id="rwCost" type="number" value="50" placeholder="所需积分"><button class="btn" onclick="addReward()">✨ 添加奖品</button></div>` +
            D.pointsConfig.map(r=>`<div class="card"><div class="card-title">🎁 ${esc(r.name)}</div><div class="card-desc"><span class="points-badge">💰 ${r.cost} 积分</span></div><div style="margin-top:6px"><button class="btn btn-del" onclick="delReward('${r.id}')">删除</button></div></div>`).join('') || '<div class="empty">暂无奖品</div>';
    } else if(curTab==='log') {
        const checked = D.tasks.filter(t=>t.checked).length;
        const totalPts = D.tasks.filter(t=>t.checked).reduce((s,t)=>s+t.points,0);
        const redeemed = D.pointsLog.length;
        const redeemedCost = D.pointsLog.reduce((s,l)=>s+l.cost,0);
        c.innerHTML = `<div class="card"><div class="card-title">📊 统计概览</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            <div style="text-align:center"><div style="font-size:24px;font-weight:bold">${checked}</div><div style="font-size:12px;opacity:0.7">已打卡次数</div></div>
            <div style="text-align:center"><div style="font-size:24px;font-weight:bold">${totalPts}</div><div style="font-size:12px;opacity:0.7">累计获得积分</div></div>
            <div style="text-align:center"><div style="font-size:24px;font-weight:bold">${redeemed}</div><div style="font-size:12px;opacity:0.7">兑换次数</div></div>
            <div style="text-align:center"><div style="font-size:24px;font-weight:bold">${redeemedCost}</div><div style="font-size:12px;opacity:0.7">已消耗积分</div></div></div></div>` +
            (D.pointsLog.length ? `<div class="card"><div class="card-title">📋 兑换记录</div>` + D.pointsLog.slice(0,20).map(l=>`<div class="log-item">🎁 ${esc(l.rewardName)} - ${l.cost}积分 <span style="opacity:0.5">${esc(l.time)}</span></div>`).join('') + '</div>' : '') +
            (D.tasks.length ? `<div class="card"><div class="card-title">✅ 打卡记录</div>` + D.tasks.filter(t=>t.checked).slice(0,20).map(t=>`<div class="log-item">${esc(t.taskName)} +${t.points}积分 <span style="opacity:0.5">${esc(t.checkedAt)}</span></div>`).join('') + '</div>' : '');
    }
}
load();
</script>
</body>
</html>

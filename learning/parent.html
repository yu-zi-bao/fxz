<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理（家长端）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: #667eea; text-decoration: none; font-weight: bold; background: white; padding: 8px 16px; border-radius: 15px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #667eea; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: white; border-radius: 12px; font-size: 14px; font-weight: bold; color: #7f8c8d; cursor: pointer; border: 2px solid #dfe6e9; }
        .tab.active { color: #667eea; border-color: #667eea; background: #f0f4ff; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 2px solid #dfe6e9; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        .card-title { font-size: 16px; font-weight: bold; color: #667eea; margin-bottom: 8px; }
        .btn { width: 100%; padding: 12px; border: 2px solid #667eea; background: white; border-radius: 12px; font-size: 15px; font-weight: bold; color: #667eea; cursor: pointer; margin-bottom: 10px; }
        .btn:hover { background: #f0f4ff; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 14px; color: #777; margin-bottom: 6px; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 10px; border: 2px solid #dfe6e9; border-radius: 10px; font-size: 14px; }
        .tag { display: inline-block; background: #e8f5e9; color: #4caf50; padding: 4px 10px; border-radius: 15px; font-size: 12px; margin: 3px; }
        #loading { text-align: center; padding: 20px; color: #667eea; }
        #error { display: none; color: #ff6b6b; padding: 10px; background: #ffe0e0; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回</a>
            <h1>👨‍👩‍👧 学习管理（家长端）</h1>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('homework')">📚 作业</div>
            <div class="tab" onclick="switchTab('tasks')">✅ 打卡</div>
            <div class="tab" onclick="switchTab('points')">🎁 奖品</div>
            <div class="tab" onclick="switchTab('log')">📊 记录</div>
        </div>
        <div id="loading">⏳ 正在加载云端数据...</div>
        <div id="error"></div>
        <div id="content" style="display:none;">
            <div class="section active" id="section-homework">
                <div class="card"><div class="card-title">📚 布置今日作业</div>
                    <div class="input-group"><textarea id="hwContent" rows="4" placeholder="输入今日作业内容..."></textarea></div>
                    <button class="btn" onclick="saveHomework()">💾 发布作业到云端</button>
                </div>
                <div class="card"><div class="card-title">📋 已发布的作业</div><div id="hw-list"></div></div>
            </div>
            <div class="section" id="section-tasks">
                <div class="card"><div class="card-title">✅ 配置打卡任务</div>
                    <div class="input-group"><input type="text" id="taskName" placeholder="任务名称，如：晨读15分钟"></div>
                    <div class="input-group"><input type="number" id="taskPoints" placeholder="完成后奖励积分" value="10"></div>
                    <button class="btn" onclick="addTask()">➕ 添加任务到云端</button>
                </div>
                <div class="card"><div class="card-title">📋 已配置的任务</div><div id="task-list"></div></div>
            </div>
            <div class="section" id="section-points">
                <div class="card"><div class="card-title">🎁 配置奖品列表</div>
                    <div class="input-group"><input type="text" id="pointName" placeholder="奖品名称，如：看手机20分钟"></div>
                    <div class="input-group"><input type="number" id="pointCost" placeholder="兑换所需积分" value="50"></div>
                    <button class="btn" onclick="addPoint()">➕ 添加奖品到云端</button>
                </div>
                <div class="card"><div class="card-title">🎁 已配置的奖品</div><div id="point-list"></div></div>
            </div>
            <div class="section" id="section-log">
                <div class="card"><div class="card-title">📊 打卡记录</div><div id="log-list"></div></div>
            </div>
        </div>
    </div>
    <script>
        const GITEE_API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/learning.json';
        const GITEE_TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        let fileSHA = null, data = { homework: [], tasksConfig: [], pointsConfig: [], pointsLog: [] };

        async function loadFromCloud() {
            try {
                const res = await fetch(GITEE_API + '?ref=master', { headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const d = await res.json();
                fileSHA = d.sha;
                data = JSON.parse(atob(d.content));
                renderAll();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch(e) { document.getElementById('error').textContent = '⚠️ 加载失败：' + e.message; document.getElementById('error').style.display = 'block'; document.getElementById('loading').style.display = 'none'; }
        }

        async function saveToCloud() {
            if (!fileSHA) { alert('请先刷新页面获取 SHA'); return; }
            try {
                const jsonStr = JSON.stringify(data, null, 2);
                const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
                const res = await fetch(GITEE_API, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: base64, message: '更新学习数据', branch: 'master', sha: fileSHA })
                });
                if (!res.ok) throw new Error('保存失败 ' + res.status);
            } catch(e) { alert('⚠️ ' + e.message); }
        }

        function switchTab(name) { document.querySelectorAll('.tab').forEach((t,i) => { t.classList.toggle('active', ['homework','tasks','points','log'][i] === name); }); document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById('section-' + name).classList.add('active'); }
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        function renderAll() {
            document.getElementById('hw-list').innerHTML = (data.homework || []).length ? (data.homework || []).reverse().map(h => '<div style="margin-bottom:8px;padding:8px;background:#f8f9fa;border-radius:8px;"><div style="font-size:14px;font-weight:bold;">' + esc(h.content) + '</div><div style="font-size:12px;color:#999;margin-top:4px;">🕐 ' + h.time + '</div></div>').join('') : '<div style="color:#999;text-align:center;padding:20px;">暂无作业</div>';
            document.getElementById('task-list').innerHTML = (data.tasksConfig || []).map(t => '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:8px;background:#f8f9fa;border-radius:8px;"><span>' + esc(t.name) + '</span><span class="tag">+' + t.points + '分</span></div>').join('') || '<div style="color:#999;text-align:center;padding:20px;">暂无任务</div>';
            document.getElementById('point-list').innerHTML = (data.pointsConfig || []).map(p => '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:8px;background:#f8f9fa;border-radius:8px;"><span>' + esc(p.name) + '</span><span class="tag">' + p.cost + '积分</span></div>').join('') || '<div style="color:#999;text-align:center;padding:20px;">暂无奖品</div>';
            document.getElementById('log-list').innerHTML = (data.pointsLog || []).length ? (data.pointsLog || []).reverse().map(l => '<div style="margin-bottom:8px;padding:8px;background:#f8f9fa;border-radius:8px;"><div>' + esc(l.action) + '</div><div style="font-size:12px;color:#999;">🕐 ' + l.time + '</div></div>').join('') : '<div style="color:#999;text-align:center;padding:20px;">暂无记录</div>';
        }

        async function saveHomework() { const c = document.getElementById('hwContent').value.trim(); if (!c) { alert('请输入作业内容'); return; } if (!data.homework) data.homework = []; data.homework.push({ content: c, time: new Date().toLocaleString() }); renderAll(); await saveToCloud(); document.getElementById('hwContent').value = ''; }
        async function addTask() { const n = document.getElementById('taskName').value.trim(), p = parseInt(document.getElementById('taskPoints').value); if (!n) { alert('请输入任务名称'); return; } if (!data.tasksConfig) data.tasksConfig = []; data.tasksConfig.push({ name: n, points: p || 10 }); renderAll(); await saveToCloud(); document.getElementById('taskName').value = ''; document.getElementById('taskPoints').value = '10'; }
        async function addPoint() { const n = document.getElementById('pointName').value.trim(), c = parseInt(document.getElementById('pointCost').value); if (!n) { alert('请输入奖品名称'); return; } if (!data.pointsConfig) data.pointsConfig = []; data.pointsConfig.push({ name: n, cost: c || 50 }); renderAll(); await saveToCloud(); document.getElementById('pointName').value = ''; document.getElementById('pointCost').value = '50'; }
        window.addEventListener('load', loadFromCloud);
    </script>
</body>
</html>

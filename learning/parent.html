<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理（家长端）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { font-size: 24px; color: #667eea; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: white; border: 2px solid #dfe6e9; border-radius: 12px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: #667eea; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); border: 3px solid #dfe6e9; }
        .card h3 { color: #667eea; margin-bottom: 15px; font-size: 16px; }
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #dfe6e9; border-radius: 10px; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        .btn { padding: 10px 20px; border: none; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-success { background: linear-gradient(135deg, #56ab2f, #a8e063); color: white; }
        .item { background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 2px solid #e9ecef; }
        .item-title { font-weight: bold; margin-bottom: 5px; }
        .item-meta { font-size: 12px; color: #666; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .delete-btn { background: #ff6b6b; color: white; }
        #error { background: #ffe0e0; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; color: #d32f2f; }
        #loading { text-align: center; padding: 20px; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回</a>
            <h1>👨‍👩‍👧 家长端</h1>
        </div>
        <div id="error"></div>
        <div id="loading">⏳ 加载中...</div>
        <div id="content" style="display:none">
            <div class="tabs">
                <div class="tab active" onclick="showTab('homework')">📚 发布作业</div>
                <div class="tab" onclick="showTab('tasks')">✅ 打卡任务</div>
                <div class="tab" onclick="showTab('prizes')">🎁 奖品管理</div>
                <div class="tab" onclick="showTab('records')">📊 学习记录</div>
            </div>

            <!-- 作业管理 -->
            <div id="tab-homework" class="tab-content">
                <div class="card">
                    <h3>📚 发布新作业</h3>
                    <input type="text" id="hwTitle" placeholder="作业科目">
                    <textarea id="hwContent" placeholder="作业内容"></textarea>
                    <input type="date" id="hwDate">
                    <button class="btn btn-primary" onclick="addHomework()">📤 发布作业</button>
                </div>
                <div class="card">
                    <h3>📋 已发布作业</h3>
                    <div id="homeworkList"></div>
                </div>
            </div>

            <!-- 打卡任务 -->
            <div id="tab-tasks" class="tab-content" style="display:none">
                <div class="card">
                    <h3>✅ 添加打卡任务</h3>
                    <input type="text" id="taskName" placeholder="任务名称，如：背英语单词">
                    <input type="number" id="taskPoints" placeholder="完成奖励积分" value="10">
                    <button class="btn btn-primary" onclick="addTask()">➕ 添加任务</button>
                </div>
                <div class="card">
                    <h3>📋 打卡任务列表</h3>
                    <div id="tasksList"></div>
                </div>
            </div>

            <!-- 奖品管理 -->
            <div id="tab-prizes" class="tab-content" style="display:none">
                <div class="card">
                    <h3>🎁 添加奖品</h3>
                    <input type="text" id="prizeName" placeholder="奖品名称，如：看手机20分钟">
                    <input type="number" id="prizeCost" placeholder="所需积分" value="50">
                    <button class="btn btn-primary" onclick="addPrize()">➕ 添加奖品</button>
                </div>
                <div class="card">
                    <h3>🏆 奖品列表</h3>
                    <div id="prizesList"></div>
                </div>
            </div>

            <!-- 学习记录 -->
            <div id="tab-records" class="tab-content" style="display:none">
                <div class="card">
                    <h3>📊 打卡记录</h3>
                    <div id="tasksLog"></div>
                </div>
                <div class="card">
                    <h3>🎁 兑换记录</h3>
                    <div id="pointsLog"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/learning.json?ref=master';
        const TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        let currentSha = '';
        let data = { homework: [], tasks: [], prizes: [], tasksLog: [], pointsLog: [] };

        function b64toText(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }
        function textToB64(text) {
            const bytes = new TextEncoder('utf-8').encode(text);
            return btoa(String.fromCharCode(...bytes));
        }

        async function loadData() {
            try {
                const res = await fetch(API, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                currentSha = json.sha;
                data = JSON.parse(b64toText(json.content));
                if (!data.homework) data.homework = [];
                if (!data.tasks) data.tasks = [];
                if (!data.prizes) data.prizes = [];
                if (!data.tasksLog) data.tasksLog = [];
                if (!data.pointsLog) data.pointsLog = [];
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderAll();
            } catch(e) { showError('加载失败：' + e.message); }
        }

        async function saveData() {
            const b64 = textToB64(JSON.stringify(data, null, 2));
            const body = JSON.stringify({ content: b64, message: '更新学习数据', branch: 'master', sha: currentSha });
            try {
                const res = await fetch('https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/learning.json', {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
                    body: body
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error('保存失败 ' + res.status + ': ' + err.substring(0, 80));
                }
                const result = await res.json();
                currentSha = result.content.sha;
                renderAll();
            } catch(e) { showError('保存失败：' + e.message); }
        }

        function showTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById('tab-' + name).style.display = 'block';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        function addHomework() {
            const title = document.getElementById('hwTitle').value.trim();
            const content = document.getElementById('hwContent').value.trim();
            const date = document.getElementById('hwDate').value;
            if (!title || !content) { showError('请填写完整'); return; }
            data.homework.unshift({ id: Date.now().toString(), title, content, date, time: new Date().toLocaleString() });
            document.getElementById('hwTitle').value = '';
            document.getElementById('hwContent').value = '';
            saveData();
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const points = parseInt(document.getElementById('taskPoints').value) || 10;
            if (!name) { showError('请填写任务名称'); return; }
            data.tasks.push({ id: Date.now().toString(), name, points });
            document.getElementById('taskName').value = '';
            saveData();
        }

        function addPrize() {
            const name = document.getElementById('prizeName').value.trim();
            const cost = parseInt(document.getElementById('prizeCost').value) || 50;
            if (!name) { showError('请填写奖品名称'); return; }
            data.prizes.push({ id: Date.now().toString(), name, cost });
            document.getElementById('prizeName').value = '';
            saveData();
        }

        function deleteItem(type, id) {
            if (!confirm('确定删除吗？')) return;
            if (type === 'homework') data.homework = data.homework.filter(x => x.id !== id);
            if (type === 'tasks') data.tasks = data.tasks.filter(x => x.id !== id);
            if (type === 'prizes') data.prizes = data.prizes.filter(x => x.id !== id);
            saveData();
        }

        function renderAll() {
            document.getElementById('homeworkList').innerHTML = data.homework.length === 0 ? 
                '<div style="text-align:center;color:#999;padding:20px">暂无作业</div>' :
                data.homework.map(h => `
                    <div class="item">
                        <div class="item-title">${h.title}</div>
                        <div class="item-meta">${h.content}<br>📅 ${h.date || '未设置日期'}</div>
                        <div class="btn-group"><button class="btn delete-btn" onclick="deleteItem('homework','${h.id}')">🗑️ 删除</button></div>
                    </div>
                `).join('');

            document.getElementById('tasksList').innerHTML = data.tasks.length === 0 ?
                '<div style="text-align:center;color:#999;padding:20px">暂无打卡任务</div>' :
                data.tasks.map(t => `
                    <div class="item">
                        <div class="item-title">${t.name}</div>
                        <div class="item-meta">⭐ 完成奖励 ${t.points} 积分</div>
                        <div class="btn-group"><button class="btn delete-btn" onclick="deleteItem('tasks','${t.id}')">🗑️ 删除</button></div>
                    </div>
                `).join('');

            document.getElementById('prizesList').innerHTML = data.prizes.length === 0 ?
                '<div style="text-align:center;color:#999;padding:20px">暂无奖品</div>' :
                data.prizes.map(p => `
                    <div class="item">
                        <div class="item-title">${p.name}</div>
                        <div class="item-meta">🎯 需要 ${p.cost} 积分</div>
                        <div class="btn-group"><button class="btn delete-btn" onclick="deleteItem('prizes','${p.id}')">🗑️ 删除</button></div>
                    </div>
                `).join('');

            document.getElementById('tasksLog').innerHTML = data.tasksLog.length === 0 ?
                '<div style="text-align:center;color:#999;padding:20px">暂无打卡记录</div>' :
                data.tasksLog.map(t => `
                    <div class="item">
                        <div class="item-title">✅ ${t.taskName}</div>
                        <div class="item-meta">获得 +${t.points} 积分 | ${t.time}</div>
                    </div>
                `).join('');

            document.getElementById('pointsLog').innerHTML = data.pointsLog.length === 0 ?
                '<div style="text-align:center;color:#999;padding:20px">暂无兑换记录</div>' :
                data.pointsLog.map(p => `
                    <div class="item">
                        <div class="item-title">🎁 ${p.prizeName}</div>
                        <div class="item-meta">消耗 -${p.cost} 积分 | ${p.time}</div>
                    </div>
                `).join('');
        }

        function showError(msg) {
            document.getElementById('error').textContent = '⚠️ ' + msg;
            document.getElementById('error').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        loadData();
    </script>
</body>
</html>

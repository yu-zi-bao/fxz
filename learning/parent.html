<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习管理（家长端）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; color: white; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: white; text-decoration: none; opacity: 0.8; }
        h1 { font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { flex: 1; min-width: 70px; padding: 10px; text-align: center; background: rgba(255,255,255,0.15); border-radius: 10px; cursor: pointer; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; }
        .tab.active { background: rgba(255,255,255,0.9); color: #764ba2; font-weight: bold; }
        .card { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .card-title { font-weight: 600; margin-bottom: 4px; }
        .card-desc { font-size: 13px; opacity: 0.8; }
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group input, .input-group textarea { flex: 1; min-width: 100px; padding: 10px; border: none; border-radius: 10px; background: rgba(255,255,255,0.15); color: white; font-size: 14px; }
        .input-group textarea { width: 100%; min-height: 60px; resize: vertical; }
        .input-group input::placeholder, .input-group textarea::placeholder { color: rgba(255,255,255,0.5); }
        .btn { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; background: rgba(255,255,255,0.9); color: #764ba2; }
        .btn:active { transform: scale(0.96); }
        .btn-del { background: rgba(239,68,68,0.8); color: white; font-size: 11px; padding: 4px 10px; }
        .status { text-align: center; font-size: 12px; opacity: 0.7; margin-bottom: 10px; min-height: 18px; }
        .empty { text-align: center; padding: 30px; opacity: 0.6; font-size: 13px; }
        .points-badge { display: inline-block; background: linear-gradient(135deg, #FFD700, #FFA500); color: #333; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }
        .log-item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
    </style>
</head>
<body>

        <div class="header">
            <a href="./"

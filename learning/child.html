<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习打卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; padding-top: 20px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 22px; color: #e17055; }
        .child-badge { background: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #e17055; font-size: 14px; }
        .back-link { position: fixed; top: 20px; left: 20px; color: #e17055; text-decoration: none; font-weight: bold; background: white; padding: 10px 18px; border-radius: 20px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); z-index: 10; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 10px 16px; border-radius: 20px; border: 2px solid #dfe6e9; background: white; cursor: pointer; font-size: 14px; white-space: nowrap; transition: 0.3s; }
        .tab.active { border-color: #e17055; background: #e17055; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background: white; border-radius: 16px; padding: 15px; margin-bottom: 10px; border: 2px solid #f0f0f0; }
        .card h3 { color: #e17055; margin-bottom: 8px; }
        .card p { font-size: 14px; color: #666; margin-bottom: 5px; }
        .card .actions { display: flex; gap: 8px; margin-top: 10px; }
        .card .actions button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: bold; color: white; }
        .btn-check { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); }
        .btn-redeem { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .btn-disabled { background: #bdc3c7; cursor: not-allowed; }
        
        .points-display { text-align: center; padding: 20px; background: white; border-radius: 16px; margin-bottom: 15px; }
        .points-display .number { font-size: 48px; color: #e17055; font-weight: bold; }
        .points-display .label { font-size: 16px; color: #7f8c8d; }
        
        .empty { text-align: center; padding: 30px; color: #999; }
        .error-msg { background: #ffebee; color: #e74c3c; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: none; font-size: 14px; }
        .success-msg { background: #d4edda; color: #155724; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: none; font-size: 14px; }
    </style>
</head>
<body>
    <a href="./child-select.html" class="back-link">← 换人</a>
    
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">🎒 学习打卡</h1>
            <div class="child-badge" id="childBadge">👧🏻 艺艺</div>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        
        <div class="points-display">
            <div class="number" id="totalPoints">0</div>
            <div class="label">我的积分 💰</div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('homework')">📚 今日作业</div>
            <div class="tab" onclick="switchTab('tasks')">✅ 打卡任务</div>
            <div class="tab" onclick="switchTab('prizes')">🎁 兑换奖品</div>
            <div class="tab" onclick="switchTab('records')">📈 我的记录</div>
        </div>
        
        <div class="tab-content active" id="tab-homework">
            <div id="homeworkList"></div>
        </div>
        
        <div class="tab-content" id="tab-tasks">
            <div id="tasksList"></div>
        </div>
        
        <div class="tab-content" id="tab-prizes">
            <div id="prizesList"></div>
        </div>
        
        <div class="tab-content" id="tab-records">
            <div id="recordsList"></div>
        </div>
    </div>

    <script>
        const GITEE_API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/learning.json';
        const GITEE_TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        
        const urlParams = new URLSearchParams(window.location.search);
        const currentChild = urlParams.get('child') || 'yiyi';
        
        let fileSHA = '';
        let data = {
            yiyi: { tasksConfig: [], tasksLog: [], pointsConfig: [], pointsLog: [], homework: [], prizes: [] },
            xinxin: { tasksConfig: [], tasksLog: [], pointsConfig: [], pointsLog: [], homework: [], prizes: [] }
        };
        
        function base64Decode(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }
        function textToBase64(text) {
            const bytes = new TextEncoder().encode(text);
            return btoa(String.fromCharCode(...bytes));
        }
        
        function initApp() {
            const childNames = { yiyi: '👧🏻 艺艺', xinxin: '👶🏻 欣欣' };
            document.getElementById('childBadge').textContent = childNames[currentChild] || currentChild;
            loadFromCloud();
        }
        
        async function loadFromCloud() {
            try {
                const res = await fetch(GITEE_API + '?ref=master', {
                    headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const result = await res.json();
                fileSHA = result.sha;
                const decoded = base64Decode(result.content);
                const parsed = JSON.parse(decoded);
                data.yiyi = { tasksConfig: [], tasksLog: [], pointsConfig: [], pointsLog: [], homework: [], prizes: [], ...parsed.yiyi };
                data.xinxin = { tasksConfig: [], tasksLog: [], pointsConfig: [], pointsLog: [], homework: [], prizes: [], ...parsed.xinxin };
                renderAll();
            } catch(e) {
                showError('加载失败：' + e.message);
            }
        }
        
        async function saveToCloud() {
            if (!fileSHA) return;
            try {
                const jsonStr = JSON.stringify(data, null, 2);
                const b64 = textToBase64(jsonStr);
                const res = await fetch(GITEE_API, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: b64, message: '更新学习数据', branch: 'master', sha: fileSHA })
                });
                if (!res.ok) throw new Error('保存失败 ' + res.status);
                const result = await res.json();
                fileSHA = result.content.sha;
                renderAll();
            } catch(e) {
                showError('保存失败：' + e.message);
            }
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                const tabs = ['homework', 'tasks', 'prizes', 'records'];
                t.classList.toggle('active', tabs[i] === tabName);
            });
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
        }
        
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = '⚠️ ' + msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }
        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = '✅ ' + msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }
        
        function getCD() { return data[currentChild]; }
        
        function getTotalPoints() {
            const cd = getCD();
            return (cd.tasksLog?.reduce((s, r) => s + r.points, 0) || 0) + 
                   (cd.pointsLog?.reduce((s, r) => s + r.points, 0) || 0);
        }
        
        function renderAll() {
            document.getElementById('totalPoints').textContent = getTotalPoints();
            renderHomework();
            renderTasks();
            renderPrizes();
            renderRecords();
        }
        
        function renderHomework() {
            const cd = getCD();
            const container = document.getElementById('homeworkList');
            if (!cd.homework || cd.homework.length === 0) {
                container.innerHTML = '<div class="empty">今天没有作业哦 🎉</div>';
                return;
            }
            container.innerHTML = [...cd.homework].reverse().map(h => `
                <div class="card">
                    <h3>${escapeHtml(h.title)}</h3>
                    <p>📅 ${h.date}</p>
                    <p>${escapeHtml(h.content)}</p>
                </div>
            `).join('');
        }
        
        function renderTasks() {
            const cd = getCD();
            const container = document.getElementById('tasksList');
            if (!cd.tasksConfig || cd.tasksConfig.length === 0) {
                container.innerHTML = '<div class="empty">暂无打卡任务</div>';
                return;
            }
            container.innerHTML = cd.tasksConfig.map((t, i) => {
                const today = new Date().toISOString().split('T')[0];
                const alreadyDone = cd.tasksLog?.some(r => r.taskId === t.id && r.time.startsWith(today));
                return `
                    <div class="card">
                        <h3>${escapeHtml(t.name)}</h3>
                        <p>💰 完成可获得 ${t.points} 积分</p>
                        <div class="actions">
                            ${alreadyDone ? 
                                '<button class="btn-disabled" disabled>✅ 已完成</button>' :
                                `<button class="btn-check" onclick="doCheckIn(${i})">⭐ 打卡</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderPrizes() {
            const cd = getCD();
            const container = document.getElementById('prizesList');
            const totalPoints = getTotalPoints();
            if (!cd.prizes || cd.prizes.length === 0) {
                container.innerHTML = '<div class="empty">暂无奖品</div>';
                return;
            }
            container.innerHTML = cd.prizes.map((p, i) => {
                const canRedeem = totalPoints >= p.cost;
                return `
                    <div class="card">
                        <h3>${escapeHtml(p.name)}</h3>
                        <p>💰 需要 ${p.cost} 积分</p>
                        <p>当前积分：${totalPoints}</p>
                        <div class="actions">
                            ${canRedeem ? 
                                `<button class="btn-redeem" onclick="redeemPrize(${i})">🎁 兑换</button>` :
                                `<button class="btn-disabled" disabled>积分不足</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderRecords() {
            const cd = getCD();
            const container = document.getElementById('recordsList');
            const allRecords = [...(cd.tasksLog || [])].map(r => ({...r, type: 'task'}));
            if (allRecords.length === 0) {
                container.innerHTML = '<div class="empty">暂无记录</div>';
                return;
            }
            container.innerHTML = [...allRecords].reverse().map(r => `
                <div class="card">
                    <h3>${escapeHtml(r.taskName || r.name || '打卡')}</h3>
                    <p>💰 +${r.points}积分</p>
                    <p>🕐 ${r.time}</p>
                </div>
            `).join('');
        }
        
        async function doCheckIn(index) {
            const cd = getCD();
            const task = cd.tasksConfig[index];
            if (!task) return;
            if (!confirm(`确定完成"${task.name}"吗？`)) return;
            
            cd.tasksLog.push({
                taskId: task.id,
                taskName: task.name,
                points: task.points,
                time: new Date().toLocaleString()
            });
            await saveToCloud();
            showSuccess('打卡成功！+ ' + task.points + '积分');
        }
        
        async function redeemPrize(index) {
            const cd = getCD();
            const prize = cd.prizes[index];
            if (!prize) return;
            if (!confirm(`确定用 ${prize.cost} 积分兑换"${prize.name}"吗？`)) return;
            
            cd.pointsLog.push({
                id: Date.now().toString(),
                type: 'redeem',
                reason: '兑换：' + prize.name,
                points: -prize.cost,
                time: new Date().toLocaleString()
            });
            await saveToCloud();
            showSuccess('兑换成功！请找家长兑现 🎁');
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        window.addEventListener('load', initApp);
    </script>
</body>
</html>

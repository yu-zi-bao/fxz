<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习打卡（小朋友端）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: #667eea; text-decoration: none; font-weight: bold; background: white; padding: 8px 16px; border-radius: 15px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #667eea; }
        .points-badge { display: inline-block; background: linear-gradient(135deg, #FFD700, #FFA500); color: #333; padding: 10px 30px; border-radius: 25px; font-size: 24px; font-weight: bold; margin: 10px 0 20px; box-shadow: 0 4px 15px rgba(255,215,0,0.3); }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: white; border-radius: 12px; font-size: 14px; font-weight: bold; color: #7f8c8d; cursor: pointer; border: 2px solid #dfe6e9; }
        .tab.active { color: #667eea; border-color: #667eea; background: #f0f4ff; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 2px solid #dfe6e9; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 10px; background: #f8f9fa; border-radius: 12px; }
        .task-info { flex: 1; }
        .task-name { font-size: 15px; font-weight: bold; color: #333; }
        .task-points { font-size: 13px; color: #4caf50; margin-top: 4px; }
        .check-btn { padding: 10px 20px; border: 2px solid #4caf50; background: white; color: #4caf50; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .check-btn.done { background: #4caf50; color: white; cursor: default; }
        .prize-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 10px; background: #fff3e0; border-radius: 12px; }
        .redeem-btn { padding: 8px 16px; border: 2px solid #ff9800; background: white; color: #ff9800; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; }
        #loading { text-align: center; padding: 20px; color: #667eea; }
        #error { display: none; color: #ff6b6b; padding: 10px; background: #ffe0e0; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回</a>
            <h1>🎒 学习打卡</h1>
        </div>
        <div style="text-align:center;"><div class="points-badge" id="total-points">⭐ 0 积分</div></div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('hw')">📚 作业</div>
            <div class="tab" onclick="switchTab('tasks')">✅ 打卡</div>
            <div class="tab" onclick="switchTab('redeem')">🎁 兑换</div>
        </div>
        <div id="loading">⏳ 正在加载...</div>
        <div id="error"></div>
        <div id="content" style="display:none;">
            <div class="section active" id="section-hw"><div class="card"><div id="hw-content" style="white-space:pre-wrap;line-height:1.8;"></div></div></div>
            <div class="section" id="section-tasks"><div id="task-list"></div></div>
            <div class="section" id="section-redeem"><div id="redeem-list"></div></div>
        </div>
    </div>
    <script>
        const GITEE_API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/learning.json';
        const GITEE_TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        let fileSHA = null, data = { homework: [], tasksConfig: [], pointsConfig: [], pointsLog: [], tasks: [] };

        async function loadFromCloud() {
            try {
                const res = await fetch(GITEE_API + '?ref=master', { headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const d = await res.json();
                fileSHA = d.sha;
                data = JSON.parse(atob(d.content));
                renderAll();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch(e) { document.getElementById('error').textContent = '⚠️ 加载失败：' + e.message; document.getElementById('error').style.display = 'block'; document.getElementById('loading').style.display = 'none'; }
        }

        async function saveToCloud() {
            if (!fileSHA) { alert('请先刷新页面'); return; }
            try {
                const jsonStr = JSON.stringify(data, null, 2);
                const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
                const res = await fetch(GITEE_API, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: base64, message: '小朋友打卡更新', branch: 'master', sha: fileSHA })
                });
                if (!res.ok) throw new Error('保存失败 ' + res.status);
            } catch(e) { alert('⚠️ ' + e.message); }
        }

        function switchTab(name) { document.querySelectorAll('.tab').forEach((t,i) => { t.classList.toggle('active', ['hw','tasks','redeem'][i] === name); }); document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById('section-' + name).classList.add('active'); }
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function getTotalPoints() { let total = 0; (data.tasks || []).forEach(t => { if (t.done) { total += (data.tasksConfig || []).find(tc => tc.name === t.taskName)?.points || 0; } }); return total; }

        function renderAll() {
            const hw = (data.homework || []).pop();
            document.getElementById('hw-content').innerHTML = hw ? '<div style="font-size:16px;line-height:1.8;">' + esc(hw.content) + '</div><div style="font-size:12px;color:#999;margin-top:10px;">🕐 ' + hw.time + '</div>' : '<div style="color:#999;text-align:center;">📭 暂无作业</div>';
            document.getElementById('total-points').textContent = '⭐ ' + getTotalPoints() + ' 积分';
            const today = new Date().toLocaleDateString();
            document.getElementById('task-list').innerHTML = (data.tasksConfig || []).map(tc => {
                const todayTask = (data.tasks || []).find(t => t.taskName === tc.name && t.date === today);
                return '<div class="task-item"><div class="task-info"><div class="task-name">' + esc(tc.name) + '</div><div class="task-points">完成奖励：+' + tc.points + ' 积分</div></div><button class="check-btn ' + (todayTask?.done ? 'done' : '') + '" onclick="checkTask(\'' + tc.name + '\',' + tc.points + ')">' + (todayTask?.done ? '✅ 已完成' : '☑️ 打卡') + '</button></div>';
            }).join('') || '<div style="color:#999;text-align:center;padding:20px;">暂无任务配置</div>';
            const points = getTotalPoints();
            document.getElementById('redeem-list').innerHTML = (data.pointsConfig || []).map(p => '<div class="prize-item"><div><div style="font-weight:bold;">' + esc(p.name) + '</div><div style="font-size:13px;color:#ff9800;">需要 ' + p.cost + ' 积分</div></div><button class="redeem-btn" onclick="redeemPrize(\'' + p.name + ',' + p.cost + '\')">🎁 兑换</button></div>').join('') || '<div style="color:#999;text-align:center;padding:20px;">暂无奖品</div>';
        }

        async function checkTask(name, points) {
            if (!data.tasks) data.tasks = [];
            const today = new Date().toLocaleDateString();
            if (!data.tasks.find(t => t.taskName === name && t.date === today)) {
                data.tasks.push({ taskName: name, points: points, date: today, done: true, time: new Date().toLocaleString() });
                alert('🎉 打卡成功！+' + points + ' 积分');
                renderAll();
                await saveToCloud();
            }
        }

        async function redeemPrize(prizeInfo) {
            const [name, cost] = prizeInfo.split(',');
            if (getTotalPoints() < parseInt(cost)) { alert('积分不够哦，继续加油！💪'); return; }
            if (!confirm('确定要用 ' + cost + ' 积分兑换"' + name + '"吗？')) return;
            if (!data.pointsLog) data.pointsLog = [];
            data.pointsLog.push({ action: '兑换了 ' + name + ' (-' + cost + '积分)', time: new Date().toLocaleString() });
            renderAll();
            await saveToCloud();
            alert('🎉 兑换成功！');
        }

        window.addEventListener('load', loadFromCloud);
    </script>
</body>
</html>

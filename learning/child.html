<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习打卡（小朋友端）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { font-size: 24px; color: #667eea; }
        .points-badge { display: inline-block; background: linear-gradient(135deg, #FFD700, #FFA500); color: #333; padding: 8px 20px; border-radius: 25px; font-size: 18px; font-weight: bold; margin: 10px 0; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: white; border: 2px solid #dfe6e9; border-radius: 12px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: #667eea; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); border: 3px solid #dfe6e9; }
        .card h3 { color: #667eea; margin-bottom: 15px; font-size: 16px; }
        .task-item { background: #f8f9fa; border-radius: 10px; padding: 15px; margin-bottom: 10px; border: 2px solid #e9ecef; display: flex; align-items: center; justify-content: space-between; }
        .task-info { flex: 1; }
        .task-name { font-weight: bold; margin-bottom: 5px; }
        .task-points { font-size: 12px; color: #FFA500; }
        .check-btn { background: linear-gradient(135deg, #56ab2f, #a8e063); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        .check-btn:active { transform: translate(1px, 1px); }
        .check-btn.done { background: #ccc; cursor: not-allowed; }
        .prize-card { background: linear-gradient(135deg, #fff5e6, #ffe6cc); border-radius: 10px; padding: 15px; margin-bottom: 10px; border: 2px solid #ffd699; }
        .prize-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .prize-cost { color: #FF6B00; font-weight: bold; }
        .redeem-btn { background: linear-gradient(135deg, #FFD700, #FFA500); color: #333; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); margin-top: 8px; }
        .redeem-btn:active { transform: translate(1px, 1px); }
        .empty { text-align: center; color: #999; padding: 20px; }
        #error { background: #ffe0e0; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; color: #d32f2f; }
        #loading { text-align: center; padding: 20px; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回</a>
            <h1>🎒 小朋友端</h1>
        </div>
        <div id="error"></div>
        <div id="loading">⏳ 加载中...</div>
        <div id="content" style="display:none">
            <div class="points-badge">⭐ ${currentPoints} 积分</div>
            <div class="tabs">
                <div class="tab active" onclick="showTab('hw')">📖 今日作业</div>
                <div class="tab" onclick="showTab('tasks')">✅ 每日打卡</div>
                <div class="tab" onclick="showTab('prizes')">🎁 奖品兑换</div>
                <div class="tab" onclick="showTab('records')">📈 我的记录</div>
            </div>

            <!-- 今日作业 -->
            <div id="tab-hw" class="tab-content">
                <div class="card">
                    <h3>📖 今日作业</h3>
                    <div id="hwList"></div>
                </div>
            </div>

            <!-- 每日打卡 -->
            <div id="tab-tasks" class="tab-content" style="display:none">
                <div class="card">
                    <h3>✅ 打卡赚积分</h3>
                    <div id="tasksList"></div>
                </div>
            </div>

            <!-- 奖品兑换 -->
            <div id="tab-prizes" class="tab-content" style="display:none">
                <div class="card">
                    <h3>🎁 奖品兑换</h3>
                    <div id="prizesList"></div>
                </div>
            </div>

            <!-- 我的记录 -->
            <div id="tab-records" class="tab-content" style="display:none">
                <div class="card">
                    <h3>📈 打卡记录</h3>
                    <div id="tasksLog"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/learning.json?ref=master';
        const TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        let currentSha = '';
        let data = { homework: [], tasks: [], prizes: [], tasksLog: [], pointsLog: [] };
        let currentPoints = 0;

        function b64toText(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }
        function textToB64(text) {
            const bytes = new TextEncoder('utf-8').encode(text);
            return btoa(String.fromCharCode(...bytes));
        }

        async function loadData() {
            try {
                const res = await fetch(API, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                currentSha = json.sha;
                data = JSON.parse(b64toText(json.content));
                if (!data.homework) data.homework = [];
                if (!data.tasks) data.tasks = [];
                if (!data.prizes) data.prizes = [];
                if (!data.tasksLog) data.tasksLog = [];
                if (!data.pointsLog) data.pointsLog = [];
                currentPoints = data.tasksLog.reduce((sum, t) => sum + (t.points || 0), 0) - data.pointsLog.reduce((sum, p) => sum + (p.cost || 0), 0);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderAll();
            } catch(e) { showError('加载失败：' + e.message); }
        }

        async function saveData() {
            const b64 = textToB64(JSON.stringify(data, null, 2));
            const body = JSON.stringify({ content: b64, message: '小朋友打卡', branch: 'master', sha: currentSha });
            try {
                const res = await fetch('https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/learning.json', {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
                    body: body
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error('保存失败 ' + res.status);
                }
                const result = await res.json();
                currentSha = result.content.sha;
                renderAll();
            } catch(e) { showError('保存失败：' + e.message); }
        }

        function showTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById('tab-' + name).style.display = 'block';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        function checkTask(taskId, taskName, points) {
            const today = new Date().toDateString();
            const alreadyDone = data.tasksLog.find(t => t.taskId === taskId && new Date(t.time).toDateString() === today);
            if (alreadyDone) { showError('今天已经打卡过了！'); return; }
            data.tasksLog.unshift({ taskId, taskName, points, time: new Date().toLocaleString() });
            currentPoints += points;
            saveData();
        }

        function redeemPrize(prizeId, prizeName, cost) {
            if (currentPoints < cost) { showError('积分不够哦！'); return; }
            if (!confirm('确定要兑换 "' + prizeName + '" 吗？')) return;
            data.pointsLog.unshift({ prizeId, prizeName, cost, time: new Date().toLocaleString() });
            currentPoints -= cost;
            saveData();
        }

        function renderAll() {
            document.querySelector('.points-badge').textContent = '⭐ ' + currentPoints + ' 积分';

            document.getElementById('hwList').innerHTML = data.homework.length === 0 ?
                '<div class="empty">📭 暂无作业</div>' :
                data.homework.slice(0, 5).map(h => `
                    <div class="task-item">
                        <div class="task-info">
                            <div class="task-name">${h.title}</div>
                            <div class="task-points">${h.content}</div>
                        </div>
                    </div>
                `).join('');

            document.getElementById('tasksList').innerHTML = data.tasks.length === 0 ?
                '<div class="empty">暂无打卡任务</div>' :
                data.tasks.map(t => {
                    const today = new Date().toDateString();
                    const done = data.tasksLog.find(l => l.taskId === t.id && new Date(l.time).toDateString() === today);
                    return `
                        <div class="task-item">
                            <div class="task-info">
                                <div class="task-name">${t.name}</div>
                                <div class="task-points">+${t.points} 积分</div>
                            </div>
                            <button class="check-btn ${done ? 'done' : ''}" onclick="checkTask('${t.id}','${t.name}',${t.points})" ${done ? 'disabled' : ''}>
                                ${done ? '✅ 已完成' : '✅ 打卡'}
                            </button>
                        </div>
                    `;
                }).join('');

            document.getElementById('prizesList').innerHTML = data.prizes.length === 0 ?
                '<div class="empty">暂无奖品</div>' :
                data.prizes.map(p => `
                    <div class="prize-card">
                        <div class="prize-name">🎁 ${p.name}</div>
                        <div class="prize-cost">需要 ${p.cost} 积分</div>
                        <button class="redeem-btn" onclick="redeemPrize('${p.id}','${p.name}',${p.cost})">兑换</button>
                    </div>
                `).join('');

            document.getElementById('tasksLog').innerHTML = data.tasksLog.length === 0 ?
                '<div class="empty">暂无打卡记录</div>' :
                data.tasksLog.map(t => `
                    <div class="task-item">
                        <div class="task-info">
                            <div class="task-name">✅ ${t.taskName}</div>
                            <div class="task-points">+${t.points} 积分 | ${t.time}</div>
                        </div>
                    </div>
                `).join('');
        }

        function showError(msg) {
            document.getElementById('error').textContent = '⚠️ ' + msg;
            document.getElementById('error').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        loadData();
    </script>
</body>
</html>

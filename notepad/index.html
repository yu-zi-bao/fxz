<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记事本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: #667eea; text-decoration: none; font-weight: bold; background: white; padding: 8px 16px; border-radius: 15px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        h1 { font-size: 26px; color: #667eea; text-shadow: 2px 2px 0 rgba(255,255,255,0.5); }
        .btn { width: 100%; padding: 14px; border: 3px solid #667eea; background: white; border-radius: 15px; font-size: 16px; font-weight: bold; color: #667eea; cursor: pointer; margin-bottom: 15px; transition: all 0.3s; box-shadow: 4px 4px 0 rgba(102,126,234,0.2); }
        .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(102,126,234,0.2); }
        .note-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 2px solid #dfe6e9; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        .note-title { font-size: 18px; font-weight: bold; color: #667eea; margin-bottom: 6px; }
        .note-text { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
        .note-time { font-size: 12px; color: #999; }
        .note-actions { text-align: right; margin-top: 10px; }
        .note-actions button { background: none; border: 2px solid #dfe6e9; border-radius: 10px; padding: 6px 14px; margin-left: 8px; cursor: pointer; font-size: 13px; color: #777; }
        .note-actions button.del:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; width: 92%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal h2 { font-size: 22px; color: #667eea; margin-bottom: 20px; text-align: center; }
        .modal input, .modal textarea { width: 100%; padding: 12px; border: 2px solid #dfe6e9; border-radius: 12px; font-size: 15px; margin-bottom: 15px; font-family: inherit; }
        .modal textarea { min-height: 150px; resize: vertical; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border: 2px solid #667eea; background: white; border-radius: 12px; font-size: 15px; font-weight: bold; color: #667eea; cursor: pointer; }
        .modal-buttons button.save { background: #667eea; color: white; }
        #loading { text-align: center; padding: 20px; color: #667eea; }
        #error { display: none; text-align: center; color: #ff6b6b; padding: 10px; background: #ffe0e0; border-radius: 10px; margin-bottom: 15px; }
        .empty { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../" class="back-link">← 返回</a>
            <h1>📝 云端记事本</h1>
        </div>
        <button class="btn" onclick="openModal()">✨ 新增笔记</button>
        <div id="loading">⏳ 正在从云端加载数据...</div>
        <div id="error"></div>
        <div id="content" style="display:none;">
            <div id="notes-list"></div>
        </div>
    </div>
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h2 id="modalTitle">✨ 新增笔记</h2>
            <input type="text" id="noteTitle" placeholder="笔记标题...">
            <textarea id="noteContent" placeholder="输入笔记内容..."></textarea>
            <div class="modal-buttons">
                <button onclick="closeModal()">取消</button>
                <button class="save" onclick="saveNote()">💾 保存到云端</button>
            </div>
        </div>
    </div>
    <script>
    (function() {
        'use strict';

        // ===== 配置 =====
        var GITEE_API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/notepad.json';
        var GITEE_TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';

        // ===== 全局状态 =====
        var state = {
            fileSHA: null,
            notes: [],
            currentEditIndex: -1
        };

        // ===== Base64 ↔ UTF-8 编解码 =====
        function base64ToText(b64) {
            var binary = atob(b64);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        function textToBase64(text) {
            var bytes = new TextEncoder().encode(text);
            return btoa(String.fromCharCode.apply(null, bytes));
        }

        // ===== 从云端加载 =====
        function loadFromCloud() {
            console.log('[CloudNote] 开始从云端加载...');
            return fetch(GITEE_API + '?ref=master', {
                headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN }
            }).then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            }).then(function(giteeData) {
                console.log('[CloudNote] 获取到 Gitee 响应，SHA:', giteeData.sha);
                state.fileSHA = giteeData.sha;

                var decoded = base64ToText(giteeData.content);
                console.log('[CloudNote] 解码后:', decoded.substring(0, 100));

                var parsed = JSON.parse(decoded);
                console.log('[CloudNote] 解析类型:', typeof parsed, 'isArray:', Array.isArray(parsed));

                // 兼容两种格式
                if (Array.isArray(parsed)) {
                    state.notes = parsed;
                } else if (parsed && Array.isArray(parsed.notes)) {
                    state.notes = parsed.notes;
                } else {
                    console.warn('[CloudNote] 格式异常，使用空数组');
                    state.notes = [];
                }

                console.log('[CloudNote] 加载成功，共', state.notes.length, '条笔记');
                renderNotes();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            }).catch(function(e) {
                console.error('[CloudNote] 加载失败:', e);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                var errEl = document.getElementById('error');
                errEl.style.display = 'block';
                errEl.textContent = '⚠️ 加载失败：' + e.message;
            });
        }

        // ===== 保存到云端 =====
        function saveToCloud() {
            console.log('[CloudNote] 开始保存，SHA:', state.fileSHA);
            if (!state.fileSHA) {
                showError('未获取到文件 SHA，请刷新页面');
                return;
            }

            var payload = {
                content: textToBase64(JSON.stringify({ notes: state.notes }, null, 2)),
                message: '更新记事本 ' + new Date().toLocaleString(),
                branch: 'master',
                sha: state.fileSHA
            };

            return fetch(GITEE_API, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function(res) {
                if (!res.ok) {
                    return res.text().then(function(t) {
                        throw new Error('保存失败 ' + res.status + ': ' + t.substring(0, 120));
                    });
                }
                return res.json();
            }).then(function(result) {
                state.fileSHA = result.content.sha;
                console.log('[CloudNote] 保存成功，新 SHA:', state.fileSHA);
                renderNotes();
            }).catch(function(e) {
                console.error('[CloudNote] 保存失败:', e);
                showError(e.message);
            });
        }

        // ===== 渲染列表 =====
        function renderNotes() {
            var container = document.getElementById('notes-list');
            var notes = state.notes;

            if (!Array.isArray(notes) || notes.length === 0) {
                container.innerHTML = '<div class="empty">📭 还没有笔记哦，点击上方按钮创建第一条！</div>';
                return;
            }

            var sorted = notes.slice().reverse();
            var html = sorted.map(function(note, i) {
                var idx = notes.length - 1 - i;
                return '<div class="note-card">' +
                    '<div class="note-title">' + esc(note.title) + '</div>' +
                    '<div class="note-text">' + esc(note.text) + '</div>' +
                    '<div class="note-time">🕐 ' + esc(note.time) + '</div>' +
                    '<div class="note-actions">' +
                        '<button onclick="window.editNote(' + idx + ')">✏️ 编辑</button>' +
                        '<button class="del" onclick="window.deleteNote(' + idx + ')">🗑️ 删除</button>' +
                    '</div></div>';
            }).join('');

            container.innerHTML = html;
        }

        function esc(t) {
            if (!t) return '';
            var d = document.createElement('div');
            d.textContent = String(t);
            return d.innerHTML;
        }

        function showError(msg) {
            var e = document.getElementById('error');
            e.style.display = 'block';
            e.textContent = '⚠️ ' + msg;
        }

        // ===== 暴露到全局 =====
        window.openModal = function() {
            state.currentEditIndex = -1;
            document.getElementById('modalTitle').textContent = '✨ 新增笔记';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteModal').classList.add('show');
        };

        window.editNote = function(idx) {
            state.currentEditIndex = idx;
            var n = state.notes[idx];
            document.getElementById('modalTitle').textContent = '✏️ 编辑笔记';
            document.getElementById('noteTitle').value = n.title || '';
            document.getElementById('noteContent').value = n.text || '';
            document.getElementById('noteModal').classList.add('show');
        };

        window.closeModal = function() {
            document.getElementById('noteModal').classList.remove('show');
        };

        window.saveNote = function() {
            var title = document.getElementById('noteTitle').value.trim();
            var text = document.getElementById('noteContent').value.trim();
            if (!title || !text) { alert('请填写完整信息'); return; }

            if (state.currentEditIndex >= 0) {
                state.notes[state.currentEditIndex].title = title;
                state.notes[state.currentEditIndex].text = text;
                state.notes[state.currentEditIndex].time = new Date().toLocaleString();
            } else {
                state.notes.push({ id: Date.now().toString(), title: title, text: text, time: new Date().toLocaleString() });
            }
            renderNotes();
            saveToCloud();
            window.closeModal();
        };

        window.deleteNote = function(idx) {
            if (!confirm('确定要删除这条笔记吗？')) return;
            state.notes.splice(idx, 1);
            renderNotes();
            saveToCloud();
        };

        // ===== 启动 =====
        console.log('[CloudNote] 页面加载完成');
        loadFromCloud();
    })();
    </script>
</body>
</html>

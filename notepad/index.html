<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记事本</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .container { width: 95%; max-width: 600px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        h1 { text-align: center; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: none; outline: none; background: rgba(255,255,255,0.9); margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 15px; border-radius: 8px; border: none; background: #ff7e5f; color: white; cursor: pointer; font-weight: bold; }
        .note-card { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .note-title { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .note-date { font-size: 12px; opacity: 0.7; margin-bottom: 10px; }
        .note-content { font-size: 14px; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
        .note-actions { text-align: right; }
        .btn-delete { background: #ff4757; font-size: 12px; padding: 5px 10px; }
        .back-btn { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: white; font-weight: bold; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; }
        .loading { text-align: center; padding: 20px; opacity: 0.8; }
        .error-box { background: rgba(255,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 云端记事本</h1>
        <div id="loading" class="loading">⏳ 正在连接云端数据...</div>
        <div id="error" class="error-box" style="display:none;"></div>
        
        <div id="content" style="display: none;">
            <div class="input-group">
                <input type="text" id="noteTitle" placeholder="标题...">
                <textarea id="noteContent" rows="3" placeholder="内容..."></textarea>
                <button onclick="addNote()">保存到云端</button>
            </div>
            <div id="notesList"></div>
            <a href="https://yu-zi-bao.github.io/fxz/" class="back-btn">🏠 返回首页</a>
        </div>
    </div>

    <script>
        // Gitee 云端配置
        const GITEE_USER = 'yusunhui';
        const GITEE_REPO = 'h5-data';
        const GITEE_TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        const GITEE_FILE_NOTEPAD = 'data/notepad.json';
        const GITEE_API = 'https://gitee.com/api/v5/repos';
        let BRANCH = 'master';

        let notes = [];

        // 获取仓库默认分支
        async function getBranch() {
            try {
                const res = await fetch(`${GITEE_API}/${GITEE_USER}/${GITEE_REPO}`, {
                    headers: { 'Authorization': `token ${GITEE_TOKEN}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.default_branch || 'master';
                }
            } catch(e) {}
            return 'master';
        }

        // 读取云端数据
        async function loadFromCloud() {
            try {
                const url = `${GITEE_API}/${GITEE_USER}/${GITEE_REPO}/contents/${GITEE_FILE_NOTEPAD}?ref=${BRANCH}`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${GITEE_TOKEN}` }
                });
                if (!res.ok) {
                    throw new Error(`API 返回 ${res.status}: ${res.statusText}`);
                }
                const data = await res.json();
                const decoded = JSON.parse(atob(data.content));
                return decoded.notes || [];
            } catch(e) {
                showError('加载云端数据失败：' + e.message);
                return [];
            }
        }

        // 写入云端数据
        async function saveToCloud(data) {
            try {
                const url = `${GITEE_API}/${GITEE_USER}/${GITEE_REPO}/contents/${GITEE_FILE_NOTEPAD}`;
                const body = {
                    content: btoa(JSON.stringify({ notes: data })),
                    message: '更新记事本：' + new Date().toLocaleString(),
                    branch: BRANCH
                };
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITEE_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.message || `API 返回 ${res.status}`);
                }
            } catch(e) {
                showError('保存失败：' + e.message);
            }
        }

        // 显示错误
        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        // 初始化
        async function init() {
            BRANCH = await getBranch();
            notes = await loadFromCloud();
            render();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        // 渲染列表
        function render() {
            const html = notes.sort((a,b) => b.time - a.time).map(n => `
                <div class="note-card">
                    <div class="note-title">${escapeHtml(n.title)}</div>
                    <div class="note-date">${new Date(n.time).toLocaleString()}</div>
                    <div class="note-content">${escapeHtml(n.content)}</div>
                    <div class="note-actions"><button class="btn-delete" onclick="deleteNote('${n.id}')">删除</button></div>
                </div>
            `).join('');
            document.getElementById('notesList').innerHTML = html || '<div style="text-align:center; opacity:0.6">暂无笔记，请先添加</div>';
        }

        // 添加笔记
        async function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if (!title) { alert('请输入标题'); return; }
            
            notes.push({ id: Date.now().toString(), title, content, time: Date.now() });
            await saveToCloud(notes);
            
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            render();
        }

        // 删除笔记
        async function deleteNote(id) {
            if (!confirm('确认删除？')) return;
            notes = notes.filter(n => n.id !== id);
            await saveToCloud(notes);
            render();
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>

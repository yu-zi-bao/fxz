<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记事本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: #667eea; text-decoration: none; font-weight: bold; background: white; padding: 8px 16px; border-radius: 15px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        h1 { font-size: 26px; color: #667eea; text-shadow: 2px 2px 0 rgba(255,255,255,0.5); }
        .btn { width: 100%; padding: 14px; border: 3px solid #667eea; background: white; border-radius: 15px; font-size: 16px; font-weight: bold; color: #667eea; cursor: pointer; margin-bottom: 15px; box-shadow: 4px 4px 0 rgba(102,126,234,0.2); transition: all 0.3s; }
        .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(102,126,234,0.2); }
        .note-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 2px solid #dfe6e9; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        .note-title { font-size: 18px; font-weight: bold; color: #667eea; margin-bottom: 6px; }
        .note-text { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
        .note-time { font-size: 12px; color: #999; }
        .note-actions { text-align: right; margin-top: 10px; }
        .note-actions button { background: none; border: 2px solid #dfe6e9; border-radius: 10px; padding: 6px 14px; margin-left: 8px; cursor: pointer; font-size: 13px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; width: 92%; max-width: 480px; }
        .modal h2 { font-size: 22px; color: #667eea; margin-bottom: 20px; text-align: center; }
        .modal input, .modal textarea { width: 100%; padding: 12px; border: 2px solid #dfe6e9; border-radius: 12px; font-size: 15px; margin-bottom: 15px; }
        .modal textarea { min-height: 150px; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border: 2px solid #667eea; background: white; border-radius: 12px; font-size: 15px; font-weight: bold; color: #667eea; cursor: pointer; }
        .modal-buttons button.save { background: #667eea; color: white; }
        #loading { text-align: center; padding: 20px; color: #667eea; }
        #error { display: none; text-align: center; color: #ff6b6b; padding: 10px; background: #ffe0e0; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../" class="back-link">← 返回</a>
            <h1>📝 云端记事本</h1>
        </div>
        <button class="btn" onclick="openModal()">✨ 新增笔记</button>
        <div id="loading">⏳ 正在从云端加载数据...</div>
        <div id="error"></div>
        <div id="content" style="display:none;"><div id="notes-list"></div></div>
    </div>
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h2 id="modalTitle">✨ 新增笔记</h2>
            <input type="text" id="noteTitle" placeholder="笔记标题...">
            <textarea id="noteContent" placeholder="输入笔记内容..."></textarea>
            <div class="modal-buttons">
                <button onclick="closeModal()">取消</button>
                <button class="save" onclick="saveNote()">💾 保存</button>
            </div>
        </div>
    </div>
    <script>
        const GITEE_API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/notepad.json';
        const GITEE_TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        let fileSHA = null, allNotes = [], editIndex = -1;

        // ✅ 关键修复：使用 TextDecoder 正确解码 UTF-8 Base64
        function base64ToUtf8(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        async function loadFromCloud() {
            try {
                const res = await fetch(GITEE_API + '?ref=master', { headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                fileSHA = data.sha;
                const jsonStr = base64ToUtf8(data.content); // ✅ 使用修复后的解码函数
                allNotes = JSON.parse(jsonStr).notes || [];
                renderNotes();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch(e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '⚠️ 加载失败：' + e.message;
            }
        }

        async function saveToCloud() {
            if (!fileSHA) { document.getElementById('error').textContent = '⚠️ 请先刷新页面'; return; }
            try {
                const jsonStr = JSON.stringify({ notes: allNotes }, null, 2);
                // 将 UTF-8 字符串编码为 Base64
                const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
                const res = await fetch(GITEE_API, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + GITEE_TOKEN, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: base64, message: '更新记事本', branch: 'master', sha: fileSHA })
                });
                if (!res.ok) throw new Error('保存失败 ' + res.status);
            } catch(e) { document.getElementById('error').textContent = '⚠️ ' + e.message; }
        }

        function renderNotes() {
            const container = document.getElementById('notes-list');
            if (allNotes.length === 0) { container.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">📭 还没有笔记</div>'; return; }
            container.innerHTML = allNotes.reverse().map((n, i) => '<div class="note-card"><div class="note-title">' + esc(n.title) + '</div><div class="note-text">' + esc(n.text) + '</div><div class="note-time">🕐 ' + n.time + '</div><div class="note-actions"><button onclick="editNote(' + (allNotes.length-1-i) + ')">✏️ 编辑</button><button onclick="deleteNote(' + (allNotes.length-1-i) + ')">🗑️ 删除</button></div></div>').join('');
        }

        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function openModal() { editIndex = -1; document.getElementById('modalTitle').textContent = '✨ 新增笔记'; document.getElementById('noteTitle').value = ''; document.getElementById('noteContent').value = ''; document.getElementById('noteModal').classList.add('show'); }
        function editNote(i) { editIndex = i; document.getElementById('modalTitle').textContent = '✏️ 编辑笔记'; document.getElementById('noteTitle').value = allNotes[i].title; document.getElementById('noteContent').value = allNotes[i].text; document.getElementById('noteModal').classList.add('show'); }
        function closeModal() { document.getElementById('noteModal').classList.remove('show'); }
        async function saveNote() {
            const t = document.getElementById('noteTitle').value.trim(), c = document.getElementById('noteContent').value.trim();
            if (!t || !c) { alert('请填写完整'); return; }
            if (editIndex >= 0) { allNotes[editIndex].title = t; allNotes[editIndex].text = c; allNotes[editIndex].time = new Date().toLocaleString(); }
            else { allNotes.push({ id: Date.now().toString(), title: t, text: c, time: new Date().toLocaleString() }); }
            renderNotes(); await saveToCloud(); closeModal();
        }
        async function deleteNote(i) { if (!confirm('确定删除？')) return; allNotes.splice(i, 1); renderNotes(); await saveToCloud(); }
        window.addEventListener('load', loadFromCloud);
    </script>
</body>
</html>

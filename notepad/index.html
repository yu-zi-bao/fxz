<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记事本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: #667eea; text-decoration: none; font-weight: bold; }
        h1 { font-size: 24px; color: #667eea; }
        .add-form { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); border: 3px solid #dfe6e9; }
        .add-form input, .add-form textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #dfe6e9; border-radius: 10px; font-size: 14px; }
        .add-form textarea { height: 100px; resize: vertical; }
        .btn { padding: 12px 24px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .btn-primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .note-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 3px solid #dfe6e9; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); position: relative; }
        .note-title { font-size: 16px; font-weight: bold; color: #667eea; margin-bottom: 8px; }
        .note-text { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 10px; }
        .note-time { font-size: 11px; color: #999; }
        .note-actions { position: absolute; top: 15px; right: 15px; }
        .note-actions button { background: none; border: none; cursor: pointer; font-size: 16px; margin-left: 5px; }
        .empty { text-align: center; padding: 40px; color: #999; }
        #error { background: #ffe0e0; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; color: #d32f2f; }
        #loading { text-align: center; padding: 20px; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回首页</a>
            <h1>📝 云端记事本</h1>
        </div>
        <div id="error"></div>
        <div id="loading">⏳ 正在从云端加载...</div>
        <div id="content" style="display:none">
            <div class="add-form">
                <input type="text" id="noteTitle" placeholder="📌 输入笔记标题...">
                <textarea id="noteText" placeholder="✏️ 输入笔记内容..."></textarea>
                <button class="btn btn-primary" onclick="addNote()">💾 保存到云端</button>
            </div>
            <div id="notesList"></div>
        </div>
    </div>
    <script>
        const API = 'https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/notepad.json?ref=master';
        const TOKEN = '8903f7dbff4a9eabb1d75ce37ba9ec4c';
        let currentSha = '';
        let notes = [];
        function base64ToText(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }
        function textToBase64(text) {
            const bytes = new TextEncoder('utf-8').encode(text);
            return btoa(String.fromCharCode(...bytes));
        }
        async function loadNotes() {
            try {
                const res = await fetch(API, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                currentSha = data.sha;
                notes = JSON.parse(base64ToText(data.content));
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderNotes();
            } catch(e) {
                showError('加载失败：' + e.message);
            }
        }
        async function saveNotes(data) {
            const jsonStr = JSON.stringify(data, null, 2);
            const b64 = textToBase64(jsonStr);
            const body = JSON.stringify({ content: b64, message: '更新笔记', branch: 'master', sha: currentSha });
            try {
                const res = await fetch('https://gitee.com/api/v5/repos/fengwolf3/h5-data/contents/data/notepad.json', {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
                    body: body
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error('保存失败 ' + res.status + ': ' + err.substring(0, 80));
                }
                const result = await res.json();
                currentSha = result.content.sha;
            } catch(e) {
                showError('保存失败：' + e.message);
            }
        }
        function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const text = document.getElementById('noteText').value.trim();
            if (!title) { showError('请输入标题'); return; }
            notes.unshift({ id: Date.now().toString(), title: title, text: text, time: new Date().toLocaleString() });
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteText').value = '';
            saveNotes(notes);
        }
        function deleteNote(id) {
            if (!confirm('确定删除吗？')) return;
            notes = notes.filter(n => n.id !== id);
            saveNotes(notes);
        }
        function renderNotes() {
            const list = document.getElementById('notesList');
            if (notes.length === 0) {
                list.innerHTML = '<div class="empty">📭 还没有笔记，写第一条吧！</div>';
                return;
            }
            list.innerHTML = notes.map(n => `
                <div class="note-card">
                    <div class="note-actions">
                        <button onclick="deleteNote('${n.id}')">🗑️</button>
                    </div>
                    <div class="note-title">${n.title}</div>
                    <div class="note-text">${n.text || '暂无内容'}</div>
                    <div class="note-time">${n.time}</div>
                </div>
            `).join('');
        }
        function showError(msg) {
            document.getElementById('error').textContent = '⚠️ ' + msg;
            document.getElementById('error').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
        loadNotes();
    </script>
</body>
</html>

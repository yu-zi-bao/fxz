<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记事本</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .container { width: 95%; max-width: 600px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        h1 { text-align: center; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: none; outline: none; background: rgba(255,255,255,0.9); margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 15px; border-radius: 8px; border: none; background: #ff7e5f; color: white; cursor: pointer; font-weight: bold; }
        .note-card { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .note-title { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .note-date { font-size: 12px; opacity: 0.7; margin-bottom: 10px; }
        .note-content { font-size: 14px; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
        .note-actions { text-align: right; }
        .btn-delete { background: #ff4757; font-size: 12px; padding: 5px 10px; }
        .back-btn { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: white; font-weight: bold; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px; }
        .loading { text-align: center; padding: 20px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 云端记事本</h1>
        <div id="loading" class="loading">⏳ 正在加载云端数据...</div>
        
        <div id="content" style="display: none;">
            <div class="input-group">
                <input type="text" id="noteTitle" placeholder="标题...">
                <textarea id="noteContent" rows="3" placeholder="内容..."></textarea>
                <button onclick="addNote()">保存到云端</button>
            </div>
            <div id="notesList"></div>
            <a href="https://yu-zi-bao.github.io/fxz/" class="back-btn">🏠 返回首页</a>
        </div>
    </div>

    <script>
        const CONFIG = {
            TOKEN: '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',
            REPO: 'yu-zi-bao/fxz',
            BRANCH: 'main', 
            FILE: 'data/notepad.json'
        };

        let notes = [];

        async function syncNotes(action, data) {
            const url = `https://api.github.com/repos/${CONFIG.REPO}/contents/${CONFIG.FILE}?ref=${CONFIG.BRANCH}`;
            const headers = { 'Authorization': `token ${CONFIG.TOKEN}`, 'Accept': 'application/vnd.github.v3+json' };
            if (action === 'read') {
                try {
                    const res = await fetch(url, { headers });
                    if (!res.ok) return null;
                    const json = await res.json();
                    return JSON.parse(atob(json.content.split('\n')[0])).notes;
                } catch(e) { return null; }
            } else {
                try {
                    const getRes = await fetch(url, { headers });
                    const meta = await getRes.json();
                    await fetch(`https://api.github.com/repos/${CONFIG.REPO}/contents/${CONFIG.FILE}`, {
                        method: 'PUT',
                        headers: { ...headers, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: 'Update Note',
                            branch: CONFIG.BRANCH,
                            sha: meta.sha,
                            content: btoa(JSON.stringify({ notes: data }, null, 2))
                        })
                    });
                } catch(e) { console.error(e); }
            }
        }

        async function init() {
            notes = await syncNotes('read') || [];
            render();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        function render() {
            const html = notes.sort((a,b) => b.time - a.time).map(n => `
                <div class="note-card">
                    <div class="note-title">${n.title}</div>
                    <div class="note-date">${new Date(n.time).toLocaleString()}</div>
                    <div class="note-content">${n.content}</div>
                    <div class="note-actions"><button class="btn-delete" onclick="deleteNote('${n.id}')">删除</button></div>
                </div>
            `).join('');
            document.getElementById('notesList').innerHTML = html || '<div style="text-align:center; opacity:0.6">暂无笔记</div>';
        }

        async function addNote() {
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            if (!title) return;
            notes.push({ id: Date.now().toString(), title, content, time: Date.now() });
            await syncNotes('write', notes);
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            render();
        }

        async function deleteNote(id) {
            if (!confirm('确认删除？')) return;
            notes = notes.filter(n => n.id !== id);
            await syncNotes('write', notes);
            render();
        }

        init();
    </script>
</body>
</html>

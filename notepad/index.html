<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记事本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; color: white; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 0; left: 0; color: white; text-decoration: none; opacity: 0.8; font-size: 14px; }
        .header h1 { font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-box input, .input-box textarea { flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 12px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); color: white; font-size: 14px; }
        .input-box textarea { min-height: 80px; width: 100%; flex: auto; resize: vertical; }
        .input-box input::placeholder, .input-box textarea::placeholder { color: rgba(255,255,255,0.5); }
        .btn { padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: bold; transition: transform 0.2s; background: rgba(255,255,255,0.9); color: #764ba2; }
        .btn:active { transform: scale(0.96); }
        .note-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .note-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .note-content { font-size: 14px; opacity: 0.9; margin-bottom: 8px; white-space: pre-wrap; }
        .note-footer { display: flex; justify-content: space-between; align-items: center; }
        .note-date { font-size: 12px; opacity: 0.6; }
        .note-actions { display: flex; gap: 6px; }
        .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 8px; }
        .btn-edit { background: rgba(251,191,36,0.8); color: white; }
        .btn-del { background: rgba(239,68,68,0.8); color: white; }
        .empty { text-align: center; padding: 40px 20px; opacity: 0.7; }
        .status { text-align: center; font-size: 12px; opacity: 0.7; margin-bottom: 10px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../" class="back-link">← 返回</a>
            <h1>📝 云端记事本</h1>
        </div>
        <div class="input-box">
            <input type="text" id="title" placeholder="标题...">
            <textarea id="content" placeholder="内容..."></textarea>
            <button class="btn" id="saveBtn" onclick="saveNote()">✨ 保存</button>
        </div>
        <div class="status" id="status"></div>
        <div id="list"></div>
    </div>
<script>
const GITEE = { user:'yusunhui', repo:'h5-data', token:'8903f7dbff4a9eabb1d75ce37ba9ec4c', branch:'master', path:'data/notepad.json' };
let notes = [], editId = null;

async function load() {
    const s = document.getElementById('status'); s.textContent = '⏳ 加载中...';
    try {
        const url = `https://gitee.com/api/v5/repos/${GITEE.user}/${GITEE.repo}/contents/${GITEE.path}?ref=${GITEE.branch}`;
        const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + GITEE.token } });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        notes = JSON.parse(atob(j.content)).notes || [];
        s.textContent = '✅ 加载成功';
    } catch(e) { s.textContent = '⚠️ 失败: ' + e.message; console.error(e); }
    render();
}

async function saveCloud() {
    const s = document.getElementById('status'); s.textContent = '⏳ 保存中...';
    try {
        const content = btoa(JSON.stringify({ notes }, null, 2));
        const url = `https://gitee.com/api/v5/repos/${GITEE.user}/${GITEE.repo}/contents/${GITEE.path}`;
        const r = await fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GITEE.token },
            body: JSON.stringify({ content, message: '更新记事本', branch: GITEE.branch })
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        s.textContent = '✅ 已保存';
        setTimeout(() => s.textContent = '', 2000);
    } catch(e) { s.textContent = '⚠️ 保存失败: ' + e.message; console.error(e); }
}

function saveNote() {
    const t = document.getElementById('title').value.trim();
    const c = document.getElementById('content').value.trim();
    if (!t) { alert('请输入标题'); return; }
    if (editId) {
        const n = notes.find(x => x.id === editId);
        if (n) { n.title = t; n.content = c; n.updated = new Date().toLocaleString(); }
        editId = null; document.getElementById('saveBtn').textContent = '✨ 保存';
    } else {
        notes.unshift({ id: Date.now().toString(), title: t, content: c, created: new Date().toLocaleString(), updated: new Date().toLocaleString() });
    }
    document.getElementById('title').value = ''; document.getElementById('content').value = '';
    render(); saveCloud();
}

function edit(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;
    document.getElementById('title').value = n.title;
    document.getElementById('content').value = n.content;
    editId = id; document.getElementById('saveBtn').textContent = '💾 修改';
}

function del(id) {
    if (!confirm('确定删除？')) return;
    notes = notes.filter(x => x.id !== id);
    if (editId === id) { editId = null; document.getElementById('title').value = ''; document.getElementById('content').value = ''; document.getElementById('saveBtn').textContent = '✨ 保存'; }
    render(); saveCloud();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function render() {
    const l = document.getElementById('list');
    if (!notes.length) { l.innerHTML = '<div class="empty">📭 还没有笔记</div>'; return; }
    l.innerHTML = notes.map(n => `<div class="note-card"><div class="note-title">${esc(n.title)}</div><div class="note-content">${esc(n.content)}</div><div class="note-footer"><span class="note-date">🕐 ${esc(n.updated)}</span><div class="note-actions"><button class="btn btn-sm btn-edit" onclick="edit('${n.id}')">编辑</button><button class="btn btn-sm btn-del" onclick="del('${n.id}')">删除</button></div></div></div>`).join('');
}

load();
</script>
</body>
</html>

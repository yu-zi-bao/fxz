<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记事本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; position: relative; }
        .back-link { position: absolute; top: 5px; left: 0; color: #667eea; text-decoration: none; font-weight: bold; background: white; padding: 8px 16px; border-radius: 20px; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        h1 { font-size: 26px; color: #667eea; text-shadow: 2px 2px 0 rgba(255,255,255,0.5); }
        .input-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 5px 5px 0 rgba(0,0,0,0.1); border: 3px solid #dfe6e9; }
        input, textarea { width: 100%; padding: 12px 16px; border: 2px solid #dfe6e9; border-radius: 12px; font-size: 15px; margin-bottom: 12px; font-family: inherit; transition: 0.3s; background: #f8f9fa; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        textarea { height: 80px; resize: vertical; }
        .btn { padding: 12px 28px; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-family: inherit; box-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn-edit { background: #feca57; color: #333; }
        .note-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); border: 3px solid #dfe6e9; transition: 0.3s; }
        .note-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(102,126,234,0.2); }
        .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .note-title { font-weight: bold; color: #667eea; font-size: 16px; }
        .note-time { color: #95a5a6; font-size: 12px; }
        .note-content { color: #555; margin-bottom: 12px; line-height: 1.6; }
        .note-actions { display: flex; gap: 8px; }
        .note-actions .btn { padding: 6px 16px; font-size: 13px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #95a5a6; }
        .empty-icon { font-size: 64px; margin-bottom: 15px; }
        #loading { text-align: center; padding: 30px; font-size: 15px; color: #667eea; }
        #error { display: none; background: #ffeaa7; padding: 12px 18px; border-radius: 12px; margin-bottom: 15px; color: #d63031; border: 2px solid #fdcb6e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../" class="back-link">← 返回</a>
            <h1>📝 云端记事本</h1>
        </div>
        <div id="error"></div>
        <div id="loading">🔄 正在加载云端数据...</div>
        <div id="content" style="display:none;">
            <div class="input-card">
                <input type="text" id="noteTitle" placeholder="✏️ 输入标题...">
                <textarea id="noteContent" placeholder="写下你的想法..."></textarea>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-primary" onclick="saveNote()">💾 保存到云端</button>
                    <button class="btn btn-danger" id="editBtn" style="display:none;" onclick="toggleEdit()">取消编辑</button>
                </div>
            </div>
            <div id="noteList"></div>
        </div>
    </div>
    <script>
        const GITEE_CONFIG = { USER: 'fengwolf3', REPO: 'h5-data', TOKEN: '8903f7dbff4a9eabb1d75ce37ba9ec4c', BRANCH: 'master', API: 'https://gitee.com/api/v5/repos' };
        let notes = [];
        let editId = null;
        async function loadNotes() {
            try {
                const url = `${GITEE_CONFIG.API}/${GITEE_CONFIG.USER}/${GITEE_CONFIG.REPO}/contents/data/notepad.json?ref=${GITEE_CONFIG.BRANCH}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${GITEE_CONFIG.TOKEN}` } });
                if (!res.ok) throw new Error(`云端返回 ${res.status}`);
                const data = await res.json();
                const json = JSON.parse(atob(data.content));
                notes = json.notes || [];
                renderNotes();
            } catch(e) {
                document.getElementById('error').textContent = '⚠️ 加载失败：' + e.message;
                document.getElementById('error').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }
        async function saveNotes() {
            const json = { notes: notes };
            const url = `${GITEE_CONFIG.API}/${GITEE_CONFIG.USER}/${GITEE_CONFIG.REPO}/contents/data/notepad.json`;
            const body = { content: btoa(unescape(encodeURIComponent(JSON.stringify(json, null, 2)))), message: '更新笔记', branch: GITEE_CONFIG.BRANCH };
            const res = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GITEE_CONFIG.TOKEN}` }, body: JSON.stringify(body) });
            if (!res.ok) throw new Error(`保存失败 ${res.status}`);
        }
        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if (!title) { alert('请填写标题'); return; }
            if (editId) {
                const idx = notes.findIndex(n => n.id === editId);
                if (idx !== -1) { notes[idx].title = title; notes[idx].content = content; notes[idx].updatedAt = new Date().toLocaleString('zh-CN'); }
                editId = null;
                document.getElementById('editBtn').style.display = 'none';
            } else {
                notes.unshift({ id: 'n' + Date.now(), title, content, createdAt: new Date().toLocaleString('zh-CN'), updatedAt: new Date().toLocaleString('zh-CN') });
            }
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            saveNotes().then(() => renderNotes()).catch(e => alert('保存失败：' + e.message));
        }
        function toggleEdit() {
            editId = null;
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
        }
        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                document.getElementById('noteTitle').value = note.title;
                document.getElementById('noteContent').value = note.content;
                editId = id;
                document.getElementById('editBtn').style.display = 'inline-block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        function deleteNote(id) {
            if (confirm('确定删除这条笔记？')) {
                notes = notes.filter(n => n.id !== id);
                saveNotes().then(() => renderNotes()).catch(e => alert('删除失败：' + e.message));
            }
        }
        function renderNotes() {
            const html = notes.length ? notes.map(n => `<div class="note-card"><div class="note-header"><span class="note-title">${n.title}</span><span class="note-time">${n.updatedAt}</span></div><div class="note-content">${n.content || '暂无内容'}</div><div class="note-actions"><button class="btn btn-edit" onclick="editNote('${n.id}')">✏️ 编辑</button><button class="btn btn-danger" onclick="deleteNote('${n.id}')">🗑️ 删除</button></div></div>`).join('') : `<div class="empty-state"><div class="empty-icon">📝</div><p>还没有笔记哦，点击上方按钮开始记录吧！</p></div>`;
            document.getElementById('noteList').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
        window.onload = loadNotes;
    </script>
</body>
</html>
